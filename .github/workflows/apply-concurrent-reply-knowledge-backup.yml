name: Apply concurrent reply and knowledge backup patch

on:
  push:
    branches:
      - feat/concurrent-reply-knowledge-backup-20260824

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/concurrent-reply-knowledge-backup-20260824
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply patch and run targeted tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python tools/apply_concurrent_reply_knowledge_backup_patch.py
          python -m pytest -q \
            tests/test_concurrent_reply_knowledge_backup_static.py \
            tests/test_local_first_reply_mode_static.py \
            tests/test_buyer_alias_send_confirmation_static.py

      - name: Commit final source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/apply_concurrent_reply_knowledge_backup_patch.py .github/workflows/apply-concurrent-reply-knowledge-backup.yml
          git add src/Bot/ChromeNs/KnowledgePolicyProfileService.cs \
                  src/Bot/ChromeNs/SmartReplyRouterService.cs \
                  src/Bot/Knowledge/KnowledgePolicyProfileUi.cs \
                  src/Bot/Knowledge/RulePolicyImportExportUi.cs \
                  src/Bot/Knowledge/KnowledgeCenterWindow.cs \
                  src/Bot/ChromeNs/BuyerMessageBurstCoordinator.cs \
                  src/Bot/ChromeNs/BuyerStreamingReplyPipeline.cs \
                  src/Bot/ChromeNs/OrderPaymentNotificationFallback.cs \
                  tests/test_concurrent_reply_knowledge_backup_static.py
          git commit -m "feat: parallelize buyer replies and add full knowledge backup"
          git push origin HEAD:feat/concurrent-reply-knowledge-backup-20260824
