name: Apply configurable Bot suffix patch

on:
  push:
    branches:
      - feature/configurable-bot-message-suffix-20260824

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/configurable-bot-message-suffix-20260824
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          BOM = b'\xef\xbb\xbf'

          def read_text(path):
              raw = Path(path).read_bytes()
              return raw.decode('utf-8-sig'), raw.startswith(BOM)

          def write_text(path, text, had_bom):
              data = text.encode('utf-8')
              Path(path).write_bytes((BOM if had_bom else b'') + data)

          def replace_once(path, old, new):
              text, had_bom = read_text(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}\nPATTERN:\n{old}')
              text = text.replace(old, new, 1)
              write_text(path, text, had_bom)

          # 1) Shop-scoped Bot message suffix service. Missing setting keeps the historical [AI]
          # default; a deliberately saved empty value means no suffix.
          reply_mode = Path('src/Bot/ChromeNs/ReplyModeService.cs')
          text, had_bom = read_text(reply_mode)
          end = '\n}\n'
          if not text.endswith(end):
              raise SystemExit('ReplyModeService.cs unexpected ending')
          service = r'''

    internal static class BotMessageSuffixService
    {
        internal const string SettingsKey = "message.bot_message_suffix";
        internal const string DefaultSuffix = "[AI]";
        internal const int MaxSuffixLength = 32;

        private static readonly IShopScopedPathProvider Paths = new ShopScopedPathProvider();

        public static string GetSuffix(string seller)
        {
            seller = (seller ?? string.Empty).Trim();
            if (seller.Length == 0) return DefaultSuffix;

            try
            {
                var shop = ShopContextLocator.ResolveBySellerNick(seller);
                return GetSuffix(new ShopScopedSettingsStore(shop, Paths));
            }
            catch (Exception ex)
            {
                Log.ErrorWithMaxCount("读取Bot消息后缀失败，已使用默认[AI]: seller=" + seller + ", error=" + ex.Message, 10);
                return DefaultSuffix;
            }
        }

        public static string GetCurrentSuffix()
        {
            try
            {
                var shop = ShopSettingsScope.Current;
                if (shop == null) return DefaultSuffix;
                return GetSuffix(new ShopScopedSettingsStore(shop, Paths));
            }
            catch (Exception ex)
            {
                Log.ErrorWithMaxCount("读取当前店铺Bot消息后缀失败，已使用默认[AI]: " + ex.Message, 10);
                return DefaultSuffix;
            }
        }

        public static void Save(string seller, string suffix)
        {
            seller = (seller ?? string.Empty).Trim();
            if (seller.Length == 0) throw new ArgumentException("保存Bot消息后缀需要卖家身份。", nameof(seller));

            var normalized = Normalize(suffix);
            var shop = ShopContextLocator.ResolveBySellerNick(seller);
            var store = new ShopScopedSettingsStore(shop, Paths);
            store.SetString(SettingsKey, normalized);
            Log.Info("Bot消息后缀已保存: seller=" + seller + ", suffix=" + normalized);
        }

        public static string Apply(string seller, string value)
        {
            value = BotOutboundMessageFormatter.StripAiMarker((value ?? string.Empty).Trim());
            if (value.Length == 0 || value.StartsWith("错误：", StringComparison.Ordinal)) return value;

            var suffix = GetSuffix(seller);
            if (suffix.Length == 0) return value;
            if (value.EndsWith(suffix, StringComparison.OrdinalIgnoreCase)) return value;
            return value + " " + suffix;
        }

        public static string Normalize(string suffix)
        {
            suffix = (suffix ?? string.Empty)
                .Replace("\r", " ")
                .Replace("\n", " ")
                .Trim();
            if (suffix.Length > MaxSuffixLength)
                suffix = suffix.Substring(0, MaxSuffixLength).Trim();
            return suffix;
        }

        private static string GetSuffix(ShopScopedSettingsStore store)
        {
            string value;
            if (store == null || !store.TryGetString(SettingsKey, out value)) return DefaultSuffix;
            return Normalize(value);
        }
    }
'''
          text = text[:-len(end)] + service + end
          write_text(reply_mode, text, had_bom)

          # 2) Settings UI: remove redundant inner "消息策略" heading and add Bot suffix input.
          ui = 'src/Bot/Options/FeatureSettingsOptionsControl.cs'
          replace_once(
              ui,
              '        private ComboBox _replyMode;\n        private CheckBox _firstInquiryFixedReplyEnabled;',
              '        private ComboBox _replyMode;\n        private TextBox _botMessageSuffix;\n        private CheckBox _firstInquiryFixedReplyEnabled;')

          replace_once(
              ui,
              '''                if (_firstInquiryFixedReplyEnabled != null && _firstInquiryFixedReplyAnswer != null)''',
              '''                if (_botMessageSuffix != null)\n                {\n                    BotMessageSuffixService.Save(effectiveSeller, _botMessageSuffix.Text ?? string.Empty);\n                }\n                if (_firstInquiryFixedReplyEnabled != null && _firstInquiryFixedReplyAnswer != null)''')

          replace_once(
              ui,
              '''            _replyMode.Items.Add("AI优先");\n            _replyMode.Items.Add("本地优先");\n\n            _firstInquiryFixedReplyEnabled = new CheckBox''',
              '''            _replyMode.Items.Add("AI优先");\n            _replyMode.Items.Add("本地优先");\n\n            _botMessageSuffix = new TextBox\n            {\n                Text = BotMessageSuffixService.GetSuffix(Seller),\n                Width = 180,\n                Height = 26,\n                MaxLength = BotMessageSuffixService.MaxSuffixLength,\n                HorizontalAlignment = HorizontalAlignment.Left,\n                Padding = new Thickness(6, 3, 6, 3)\n            };\n\n            _firstInquiryFixedReplyEnabled = new CheckBox''')

          replace_once(
              ui,
              '            result.Add(MakeSectionTitle("消息策略"));\n',
              '')

          reply_hint = '''            result.Add(MakeLabeledControl(\n                "回复模式",\n                _replyMode,\n                "AI优先：本地知识作为上下文，由AI生成最终答案。 本地优先：先检索本地知识库，高置信命中时直接回复且不调用AI；未达到高置信阈值时再调用AI。买家5分钟无新消息后，会把本轮买家、Bot和人工客服完整消息交给AI复盘，生成去重后的可复用问答进入本地知识库。"));'''
          replace_once(
              ui,
              reply_hint,
              reply_hint + '''\n            result.Add(MakeLabeledControl(\n                "Bot消息后缀",\n                _botMessageSuffix,\n                "每条 Bot 自动发送的文本消息末尾附加此后缀，默认 [AI]；留空表示不添加后缀。"));''')

          # 3) Send path: apply seller-scoped suffix before acquiring the send gate, so all echo/
          # retry comparisons use the exact text actually sent. Segmented messages recurse first,
          # therefore every real segment receives exactly one suffix.
          qn = 'src/Bot/ChromeNs/QN.cs'
          replace_once(
              qn,
              '''                return true;\n            }\n\n            await _sendGate.WaitAsync();''',
              '''                return true;\n            }\n\n            text = BotMessageSuffixService.Apply(\n                Seller == null ? string.Empty : Seller.Nick,\n                text);\n\n            await _sendGate.WaitAsync();''')

          # 4) Make the normal formatter display/store the configured suffix in scoped reply flows.
          dedup = 'src/Bot/ChromeNs/ReplyDeduplicationService.cs'
          replace_once(
              dedup,
              '''            if (value.Length == 0 || value.StartsWith("错误：", StringComparison.Ordinal)) return value;\n            if (value.EndsWith(AiMarker, StringComparison.OrdinalIgnoreCase)) return value;\n            return value + " " + AiMarker;''',
              '''            if (value.Length == 0 || value.StartsWith("错误：", StringComparison.Ordinal)) return value;\n            var suffix = BotMessageSuffixService.GetCurrentSuffix();\n            value = StripAiMarker(value);\n            if (suffix.Length == 0) return value;\n            if (value.EndsWith(suffix, StringComparison.OrdinalIgnoreCase)) return value;\n            return value + " " + suffix;''')

          replace_once(
              dedup,
              '''            value = (value ?? string.Empty).Trim();\n            while (value.EndsWith(AiMarker, StringComparison.OrdinalIgnoreCase))\n                value = value.Substring(0, value.Length - AiMarker.Length).TrimEnd();\n            return value;''',
              '''            value = (value ?? string.Empty).Trim();\n            var configuredSuffix = BotMessageSuffixService.GetCurrentSuffix();\n            if (!string.IsNullOrWhiteSpace(configuredSuffix))\n            {\n                while (value.EndsWith(configuredSuffix, StringComparison.OrdinalIgnoreCase))\n                    value = value.Substring(0, value.Length - configuredSuffix.Length).TrimEnd();\n            }\n            while (value.EndsWith(AiMarker, StringComparison.OrdinalIgnoreCase))\n                value = value.Substring(0, value.Length - AiMarker.Length).TrimEnd();\n            return value;''')

          # 5) Safety guard must ignore the configured suffix just like the legacy [AI] marker.
          guard = 'src/Bot/ChromeNs/BuyerReplyOutputGuard.cs'
          replace_once(
              guard,
              '''            value = (value ?? string.Empty).Trim();\n            foreach (var suffix in new[] { "[AI]", "【AI】", "［AI］" })''',
              '''            value = (value ?? string.Empty).Trim();\n            var configuredSuffix = BotMessageSuffixService.GetCurrentSuffix();\n            if (!string.IsNullOrWhiteSpace(configuredSuffix)\n                && value.EndsWith(configuredSuffix, StringComparison.OrdinalIgnoreCase))\n            {\n                value = value.Substring(0, value.Length - configuredSuffix.Length).TrimEnd();\n            }\n            foreach (var suffix in new[] { "[AI]", "【AI】", "［AI］" })''')

          # 6) Static regression coverage for UI, persistence, formatter and final send path.
          Path('tests/test_bot_message_suffix_static.py').write_text(r'''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]


def read(path: str) -> str:
    return (ROOT / path).read_text(encoding="utf-8-sig")


def test_message_strategy_removes_redundant_inner_heading_and_adds_suffix_field():
    source = read("src/Bot/Options/FeatureSettingsOptionsControl.cs")
    assert 'result.Add(MakeSectionTitle("消息策略"));' not in source
    assert 'private TextBox _botMessageSuffix;' in source
    assert '"Bot消息后缀"' in source
    assert 'BotMessageSuffixService.GetSuffix(Seller)' in source
    assert 'BotMessageSuffixService.Save(effectiveSeller, _botMessageSuffix.Text ?? string.Empty)' in source


def test_suffix_setting_is_shop_scoped_and_defaults_to_ai_marker():
    source = read("src/Bot/ChromeNs/ReplyModeService.cs")
    assert 'SettingsKey = "message.bot_message_suffix"' in source
    assert 'DefaultSuffix = "[AI]"' in source
    assert 'MaxSuffixLength = 32' in source
    assert 'store.SetString(SettingsKey, normalized)' in source
    assert 'if (store == null || !store.TryGetString(SettingsKey, out value)) return DefaultSuffix;' in source


def test_final_send_path_applies_suffix_before_echo_tracking_and_retry():
    source = read("src/Bot/ChromeNs/QN.cs")
    start = source.index("public async Task<bool> SendTextWithRetryAsync")
    block = source[start:start + 5000]
    apply_pos = block.index("BotMessageSuffixService.Apply(")
    gate_pos = block.index("await _sendGate.WaitAsync()")
    send_pos = block.index("var ok = await SendTextAsync(buyer, text)")
    assert apply_pos < gate_pos < send_pos
    assert 'HasRecentSellerEcho(buyer, text, sendStartedAt)' in block


def test_formatter_and_guard_understand_configured_suffix():
    formatter = read("src/Bot/ChromeNs/ReplyDeduplicationService.cs")
    guard = read("src/Bot/ChromeNs/BuyerReplyOutputGuard.cs")
    assert 'var suffix = BotMessageSuffixService.GetCurrentSuffix();' in formatter
    assert 'var configuredSuffix = BotMessageSuffixService.GetCurrentSuffix();' in formatter
    assert 'var configuredSuffix = BotMessageSuffixService.GetCurrentSuffix();' in guard
''', encoding='utf-8')
          PY

      - name: Run targeted static regression tests
        shell: bash
        run: python -m pytest -q tests/test_bot_message_suffix_static.py tests/test_buyer_alias_send_confirmation_static.py

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-bot-message-suffix-patch.yml
          git add src/Bot/ChromeNs/ReplyModeService.cs \
                  src/Bot/ChromeNs/QN.cs \
                  src/Bot/ChromeNs/ReplyDeduplicationService.cs \
                  src/Bot/ChromeNs/BuyerReplyOutputGuard.cs \
                  src/Bot/Options/FeatureSettingsOptionsControl.cs \
                  tests/test_bot_message_suffix_static.py
          git commit -m "feat: make Bot message suffix configurable"
          git push origin HEAD:feature/configurable-bot-message-suffix-20260824
