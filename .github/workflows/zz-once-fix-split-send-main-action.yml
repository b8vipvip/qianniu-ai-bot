name: One-shot split send safety patch

on:
  push:
    branches:
      - fix/split-send-main-action-20260817

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/split-send-main-action-20260817
          fetch-depth: 0

      - name: Apply source and regression-test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_method(text: str, signature: str, replacement: str) -> str:
              start = text.index(signature)
              brace = text.index('{', start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  ch = text[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise RuntimeError(f'unbalanced method: {signature}')
              return text[:start] + replacement.rstrip() + text[end:]

          qnrpa_path = Path('src/Bot/ChromeNs/QNRpa.cs')
          qnrpa = qnrpa_path.read_text(encoding='utf-8-sig')
          qnrpa = replace_method(qnrpa, '        private bool TryInvokeCachedSendButtonNow()', r'''
                  private bool TryInvokeCachedSendButtonNow()
                  {
                      if (_sendMessageButton == null || uia3Automation == null) return false;
                      try
                      {
                          var splitRect = _sendMessageButtonRect;
                          if ((splitRect.Width <= 0 || splitRect.Height <= 0) && _sendMessageButton != null)
                          {
                              splitRect = _sendMessageButton.BoundingRectangle;
                          }
                          if (splitRect.Width <= 0 || splitRect.Height <= 0) return false;

                          var arrowGuard = Math.Max(18, Math.Min(30, splitRect.Width / 3));
                          var mainWidth = splitRect.Width - arrowGuard;
                          if (mainWidth < 16) return false;
                          var x = splitRect.Left + Math.Max(8, Math.Min(mainWidth / 2, mainWidth - 8));
                          var y = splitRect.Top + splitRect.Height / 2;

                          // Resolve UIA at the exact same verified left/main-action point. We may invoke
                          // only a distinct child that is geometrically confined to the left send area.
                          // Invoking the whole Qt split-button parent is forbidden because its default
                          // action can open the Enter/Ctrl+Enter dropdown instead of sending the draft.
                          AutomationElement candidate = null;
                          try
                          {
                              candidate = uia3Automation.FromPoint(new System.Drawing.Point(x, y));
                          }
                          catch (Exception ex)
                          {
                              Log.Info("发送主按钮左侧UIA命中测试失败: " + ex.Message);
                          }

                          for (var depth = 0; candidate != null && depth < 7; depth++)
                          {
                              if (TryInvokeSafeMainSendCandidate(candidate, splitRect, x, y, arrowGuard))
                              {
                                  return true;
                              }
                              try { candidate = candidate.Parent; }
                              catch { candidate = null; }
                          }

                          // Some Qt accessibility trees return a non-action text node from FromPoint.
                          // Scan descendants as a second discovery path, but keep the same geometry gate.
                          try
                          {
                              foreach (var child in _sendMessageButton.FindAllDescendants())
                              {
                                  if (TryInvokeSafeMainSendCandidate(child, splitRect, x, y, arrowGuard))
                                  {
                                      return true;
                                  }
                              }
                          }
                          catch (Exception ex)
                          {
                              Log.Info("发送主按钮左侧UIA子控件扫描失败: " + ex.Message);
                          }

                          Log.Info("未找到可证明属于左侧主发送区域的UIA子控件，禁止Invoke整块分裂按钮: seller="
                              + SellerNick + ", rect=" + splitRect.Left + "," + splitRect.Top + ","
                              + splitRect.Width + "x" + splitRect.Height + ", safePoint=" + x + "," + y);
                          return false;
                      }
                      catch (Exception ex)
                      {
                          Log.Info("发送按钮左侧UIA安全调用失败: " + ex.Message
                              + ", type=" + ex.GetType().FullName
                              + ", hresult=0x" + ex.HResult.ToString("X8"));
                          return false;
                      }
                  }

                  private bool TryInvokeSafeMainSendCandidate(
                      AutomationElement candidate,
                      System.Drawing.Rectangle splitRect,
                      int safeX,
                      int safeY,
                      int arrowGuard)
                  {
                      if (!IsSafeMainSendInvokeCandidate(candidate, splitRect, safeX, safeY, arrowGuard))
                      {
                          return false;
                      }

                      try
                      {
                          var rect = candidate.BoundingRectangle;
                          var name = candidate.Name ?? string.Empty;
                          var automationId = candidate.AutomationId ?? string.Empty;
                          candidate.AsButton().Invoke();
                          Log.Info("已通过左侧主发送UIA子控件执行发送: seller=" + SellerNick
                              + ", name=" + name + ", automationId=" + automationId
                              + ", rect=" + rect.Left + "," + rect.Top + "," + rect.Width + "x" + rect.Height);
                          return true;
                      }
                      catch (Exception ex)
                      {
                          Log.Info("左侧主发送UIA候选不可Invoke，继续寻找父级/兄弟候选: " + ex.Message);
                          return false;
                      }
                  }

                  private static bool IsSafeMainSendInvokeCandidate(
                      AutomationElement candidate,
                      System.Drawing.Rectangle splitRect,
                      int safeX,
                      int safeY,
                      int arrowGuard)
                  {
                      if (candidate == null) return false;
                      try
                      {
                          var rect = candidate.BoundingRectangle;
                          if (rect.Width <= 0 || rect.Height <= 0 || !rect.Contains(safeX, safeY)) return false;

                          var name = candidate.Name ?? string.Empty;
                          var automationId = candidate.AutomationId ?? string.Empty;
                          var identity = (name + " " + automationId).ToLowerInvariant();
                          if (identity.Contains("arrow")
                              || identity.Contains("dropdown")
                              || identity.Contains("drop-down")
                              || identity.Contains("menu")
                              || identity.Contains("downbutton")
                              || identity.Contains("下拉")
                              || identity.Contains("展开"))
                          {
                              return false;
                          }

                          // Never invoke the full split-button parent (or an almost-identical wrapper).
                          var almostWholeSplit = Math.Abs(rect.Left - splitRect.Left) <= 2
                              && Math.Abs(rect.Top - splitRect.Top) <= 2
                              && rect.Width >= splitRect.Width - 3
                              && rect.Height >= splitRect.Height - 3;
                          if (almostWholeSplit) return false;

                          var protectedArrowStart = splitRect.Right - arrowGuard;
                          if (rect.Left >= protectedArrowStart) return false;
                          if (rect.Right > splitRect.Right - Math.Max(4, arrowGuard / 5)) return false;
                          if (rect.Left < splitRect.Left - 3 || rect.Top < splitRect.Top - 3) return false;
                          if (rect.Bottom > splitRect.Bottom + 3) return false;
                          return true;
                      }
                      catch
                      {
                          return false;
                      }
                  }
          ''')

          qnrpa = qnrpa.replace(
              '                // single UIA Invoke fallback. Never issue a second action after a coordinate click\n',
              '                // single left-main-area UIA child fallback. Never invoke the whole split button.\n')
          qnrpa = qnrpa.replace(
              '                Log.Info("发送主按钮坐标输入被系统拒绝，准备仅回退一次UIA Invoke: seller="\n                    + SellerNick + ", buyer=" + buyer);',
              '                Log.Info("发送主按钮坐标输入被系统拒绝，准备定位左侧主发送UIA子控件；禁止Invoke整块分裂按钮: seller="\n                    + SellerNick + ", buyer=" + buyer);')
          qnrpa = qnrpa.replace(
              '                    "发送按钮UIA回退调用",',
              '                    "发送按钮左侧UIA安全调用",')
          qnrpa = qnrpa.replace(
              '                    SetSendFailure("发送按钮UIA回退", "坐标输入被系统拒绝且UIA Invoke未完成");',
              '                    SetSendFailure("发送按钮UIA回退", "坐标输入被系统拒绝且未找到安全主发送UIA子控件（已禁止整块分裂按钮Invoke）");')
          qnrpa = qnrpa.replace(
              '                    buyer, text, sendStart, "发送按钮UIA回退", 3600).ConfigureAwait(false);',
              '                    buyer, text, sendStart, "发送按钮左侧UIA安全调用", 3600).ConfigureAwait(false);')
          if '_sendMessageButton.AsButton().Invoke()' in qnrpa:
              raise RuntimeError('unsafe whole split-button Invoke still present')
          if '准备仅回退一次UIA Invoke' in qnrpa:
              raise RuntimeError('old unsafe fallback log still present')
          qnrpa_path.write_text(qnrpa, encoding='utf-8-sig')

          qn_path = Path('src/Bot/ChromeNs/QN.cs')
          qn = qn_path.read_text(encoding='utf-8-sig')
          qn = replace_method(qn, '        public async Task<bool> SendTextWithRetryAsync(string buyer, string text, int retryCount = 1)', r'''
                  public async Task<bool> SendTextWithRetryAsync(string buyer, string text, int retryCount = 1)
                  {
                      await _sendGate.WaitAsync();
                      try
                      {
                          rpa.ResetSendFailure();
                          if (!await EnsureActiveBuyerForSendAsync(buyer))
                          {
                              rpa.SetSendFailure("会话确认", "无法确认目标买家会话");
                              return false;
                          }

                          var sendStartedAt = DateTime.Now;
                          var ok = await SendTextAsync(buyer, text);
                          if (!ok && await WaitForSellerEchoGraceAsync(buyer, text, sendStartedAt, 900))
                          {
                              rpa.ResetSendFailure();
                              ok = true;
                              Log.Info("自动发送动作结果未确认，但已收到同买家同文本卖家回显，按真实送达处理并取消重试: buyer="
                                  + buyer + ", text=" + text);
                          }

                          var retry = Math.Max(0, retryCount);
                          for (var i = 0; !ok && i < retry; i++)
                          {
                              Log.Info("自动发送失败，准备重试第" + (i + 1) + "次。buyer=" + buyer
                                  + ", reason=" + rpa.GetSendFailureReason() + ", text=" + text);
                              rpa.InvalidateChatControls();
                              await Task.Delay(1800);

                              // Seller echo is the source of truth. It can arrive after UIA timed out but
                              // before this retry window ends; sending again would create a duplicate.
                              if (HasRecentSellerEcho(buyer, text, sendStartedAt))
                              {
                                  rpa.ResetSendFailure();
                                  ok = true;
                                  Log.Info("重试前已收到同买家同文本卖家回显，按真实送达处理并取消重复发送: buyer="
                                      + buyer + ", text=" + text);
                                  break;
                              }

                              if (!await EnsureActiveBuyerForSendAsync(buyer))
                              {
                                  rpa.SetSendFailure("重试会话确认", "无法确认目标买家会话");
                                  return false;
                              }
                              ok = await SendTextAsync(buyer, text);
                              if (!ok && await WaitForSellerEchoGraceAsync(buyer, text, sendStartedAt, 900))
                              {
                                  rpa.ResetSendFailure();
                                  ok = true;
                                  Log.Info("重试动作结果未确认，但卖家回显已证明真实送达: buyer=" + buyer
                                      + ", text=" + text);
                              }
                          }

                          if (!ok && await WaitForSellerEchoGraceAsync(buyer, text, sendStartedAt, 1400))
                          {
                              rpa.ResetSendFailure();
                              ok = true;
                              Log.Info("最终失败判定前收到延迟卖家回显，改判真实送达: buyer=" + buyer
                                  + ", text=" + text);
                          }
                          if (!ok)
                          {
                              Log.Error("自动发送最终失败: buyer=" + buyer + ", reason=" + rpa.GetSendFailureReason());
                          }
                          return ok;
                      }
                      finally
                      {
                          _sendGate.Release();
                      }
                  }

                  private async Task<bool> WaitForSellerEchoGraceAsync(
                      string buyer,
                      string text,
                      DateTime since,
                      int milliseconds)
                  {
                      var deadline = DateTime.Now.AddMilliseconds(Math.Max(0, milliseconds));
                      while (DateTime.Now <= deadline)
                      {
                          if (HasRecentSellerEcho(buyer, text, since)) return true;
                          await Task.Delay(120);
                      }
                      return HasRecentSellerEcho(buyer, text, since);
                  }
          ''')
          qn_path.write_text(qn, encoding='utf-8-sig')

          test_path = Path('tests/test_first_inquiry_fixed_reply_static.py')
          test = test_path.read_text(encoding='utf-8-sig')
          test = test.replace(
              '    assert "AsButton().Invoke()" in source\n',
              '    assert "_sendMessageButton.AsButton().Invoke()" not in source\n'
              '    assert "uia3Automation.FromPoint(new System.Drawing.Point(x, y))" in source\n'
              '    assert "IsSafeMainSendInvokeCandidate" in source\n'
              '    assert "禁止Invoke整块分裂按钮" in source\n')
          test = test.replace(
              '    assert "发送主按钮坐标输入被系统拒绝，准备仅回退一次UIA Invoke" in button\n',
              '    assert "发送主按钮坐标输入被系统拒绝，准备定位左侧主发送UIA子控件" in button\n')
          test += r'''

          def test_delayed_exact_seller_echo_cancels_retry_and_false_failure():
              source = read("src/Bot/ChromeNs/QN.cs")
              retry = source[source.index("public async Task<bool> SendTextWithRetryAsync"):source.index("private async Task<bool> EnsureActiveBuyerForSendAsync")]
              assert "WaitForSellerEchoGraceAsync" in retry
              assert "HasRecentSellerEcho(buyer, text, sendStartedAt)" in retry
              assert "按真实送达处理并取消重试" in retry
              assert "按真实送达处理并取消重复发送" in retry
              assert "最终失败判定前收到延迟卖家回显，改判真实送达" in retry
              assert retry.index("HasRecentSellerEcho(buyer, text, sendStartedAt)") < retry.index("ok = await SendTextAsync(buyer, text);", retry.index("for (var i = 0"))
          '''
          test_path.write_text(test, encoding='utf-8-sig')
          PY

      - name: Run repository static tests
        run: python -m pytest -q tests

      - name: Commit patched sources and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/zz-once-fix-split-send-main-action.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: target Qianniu split send main action safely"
          git push origin HEAD:fix/split-send-main-action-20260817
