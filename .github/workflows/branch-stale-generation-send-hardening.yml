name: One-shot stale generation send hardening

on:
  push:
    branches:
      - fix/stale-generation-send-cancellation-20260905

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply generation-bound send hardening
        run: python .github/scripts/stale_generation_send_cancellation_20260905.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_1281_generation_bound_send_cancellation_static.py tests/test_1256_qnbot_runtime_regressions_static.py tests/test_1272_knowledge_authority_and_turn_lifecycle_static.py
      - name: Commit source hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Bot/ChromeNs/QN.cs src/Bot/ChromeNs/DeterministicAutoReplyService.cs src/Bot/ChromeNs/BuyerStreamingReplyPipeline.cs tests/test_1281_generation_bound_send_cancellation_static.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: cancel stale generations inside reliable send [skip ci]'
          git push origin HEAD:fix/stale-generation-send-cancellation-20260905
