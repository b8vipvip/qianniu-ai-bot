name: Apply order reply template v3

on:
  push:
    branches: [ agent/order-reply-template-v3 ]
    paths: [ '.github/workflows/apply-order-reply-template-v3.yml' ]

permissions:
  contents: write

jobs:
  patch-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply deterministic source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8-sig')

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          # 1) Structured order snapshot: add a buyer-remark field populated only from strict buyer-side keys/labels.
          p = 'src/Bot/ChromeNs/OrderEventHub.cs'
          s = read(p)
          s = one(s,
              '        public string SkuText { get; set; }\n        public int Quantity { get; set; }',
              '        public string SkuText { get; set; }\n        public string BuyerRemark { get; set; }\n        public int Quantity { get; set; }',
              'OrderSnapshot.BuyerRemark')
          s = one(s,
              '            if (!string.IsNullOrWhiteSpace(SkuText)) sb.Append("规格：").Append(Safe(SkuText, 160)).Append("\\n");\n            if (Quantity > 0)',
              '            if (!string.IsNullOrWhiteSpace(SkuText)) sb.Append("规格：").Append(Safe(SkuText, 160)).Append("\\n");\n            if (!string.IsNullOrWhiteSpace(BuyerRemark)) sb.Append("买家备注：").Append(Safe(BuyerRemark, 300)).Append("\\n");\n            if (Quantity > 0)',
              'summary buyer remark')
          s = one(s,
              '        private static readonly string[] QuantityKeys =\n        {\n            "quantity", "num", "buyamount", "itemcount", "count"\n        };',
              '        private static readonly string[] BuyerRemarkKeys =\n        {\n            "buyerremark", "buyermemo", "buyernote", "buyermessage", "buyermessagecontent",\n            "buyermsg", "remarkfrombuyer", "memofrombuyer"\n        };\n        private static readonly string[] QuantityKeys =\n        {\n            "quantity", "num", "buyamount", "itemcount", "count"\n        };',
              'buyer remark keys')
          s = one(s,
              '            var skuText = FindValue(flat, SkuTextKeys);\n            if (string.IsNullOrWhiteSpace(skuText)) skuText = ExtractLabeledText(combined, "规格", "SKU", "属性");\n            var tradeStatus',
              '            var skuText = FindValue(flat, SkuTextKeys);\n            if (string.IsNullOrWhiteSpace(skuText)) skuText = ExtractLabeledText(combined, "规格", "SKU", "属性");\n            var buyerRemark = FindValue(flat, BuyerRemarkKeys);\n            if (string.IsNullOrWhiteSpace(buyerRemark)) buyerRemark = ExtractLabeledText(combined, "买家备注", "买家留言");\n            var tradeStatus',
              'parse buyer remark')
          s = one(s,
              '                SkuText = Clean(skuText, 240),\n                Quantity = ParseInt',
              '                SkuText = Clean(skuText, 240),\n                BuyerRemark = Clean(buyerRemark, 500),\n                Quantity = ParseInt',
              'snapshot buyer remark assignment')
          s = one(s,
              '            if (string.IsNullOrWhiteSpace(target.SkuText)) target.SkuText = incoming.SkuText;\n            if (target.Quantity <= 0)',
              '            if (string.IsNullOrWhiteSpace(target.SkuText)) target.SkuText = incoming.SkuText;\n            if (string.IsNullOrWhiteSpace(target.BuyerRemark)) target.BuyerRemark = incoming.BuyerRemark;\n            if (target.Quantity <= 0)',
              'merge buyer remark')
          write(p, s)

          # 2) Template renderer: surface buyer remark and preserve authored whitespace/newlines byte-for-byte.
          p = 'src/Bot/ChromeNs/OrderPlacedAutoReplyService.cs'
          s = read(p)
          s = one(s,
              '            if ((template.Contains("{sku}") || template.Contains("{规格}"))\n                && (snapshot == null || string.IsNullOrWhiteSpace(snapshot.SkuText))) missing.Add("sku");',
              '            if ((template.Contains("{sku}") || template.Contains("{规格}"))\n                && (snapshot == null || string.IsNullOrWhiteSpace(snapshot.SkuText))) missing.Add("sku");\n            if (template.Contains("{买家备注}")\n                && (snapshot == null || string.IsNullOrWhiteSpace(snapshot.BuyerRemark))) missing.Add("buyer_remark");',
              'missing buyer remark')
          s = one(s,
              '            if ((template.Contains("{sku}") || template.Contains("{规格}"))\n                && snapshot != null && !string.IsNullOrWhiteSpace(snapshot.SkuText)) present.Add("sku");',
              '            if ((template.Contains("{sku}") || template.Contains("{规格}"))\n                && snapshot != null && !string.IsNullOrWhiteSpace(snapshot.SkuText)) present.Add("sku");\n            if (template.Contains("{买家备注}")\n                && snapshot != null && !string.IsNullOrWhiteSpace(snapshot.BuyerRemark)) present.Add("buyer_remark");',
              'present buyer remark')
          s = one(s,
              '                        case "sku": reason = "snapshot_sku_empty"; break;\n                        case "quantity":',
              '                        case "sku": reason = "snapshot_sku_empty"; break;\n                        case "buyer_remark": reason = "snapshot_buyer_remark_empty"; break;\n                        case "quantity":',
              'missing reason buyer remark')
          s = one(s,
              '                .Replace("{时间}", plan == null ? string.Empty : plan.EventTime.ToString("yyyy-MM-dd HH:mm:ss"))\n                .Replace("{商品}", snapshot == null ? string.Empty : snapshot.ItemTitle ?? string.Empty)\n                .Replace("{sku}", snapshot == null ? string.Empty : snapshot.SkuText ?? string.Empty)\n                .Replace("{规格}", snapshot == null ? string.Empty : snapshot.SkuText ?? string.Empty)',
              '                .Replace("{时间}", plan == null || plan.EventTime == DateTime.MinValue ? string.Empty : plan.EventTime.ToString("yyyy-MM-dd HH:mm:ss"))\n                .Replace("{商品}", snapshot == null ? string.Empty : snapshot.ItemTitle ?? string.Empty)\n                .Replace("{sku}", snapshot == null ? string.Empty : snapshot.SkuText ?? string.Empty)\n                .Replace("{规格}", snapshot == null ? string.Empty : snapshot.SkuText ?? string.Empty)\n                .Replace("{买家备注}", snapshot == null ? string.Empty : snapshot.BuyerRemark ?? string.Empty)',
              'render buyer remark and safe time')
          old_cleanup = '''            // 保留已有字段，同时清理缺失占位符造成的双空格、冒号后空格和行尾空白。\n            rendered = Regex.Replace(rendered, @"[ \\t]{2,}", " ");\n            rendered = Regex.Replace(rendered, @"([：:])\\s+", "$1");\n            rendered = Regex.Replace(rendered, @"\\s+([，。；、])", "$1");\n            rendered = Regex.Replace(rendered, @"(?m)[ \\t]+$", string.Empty).Trim();\n'''
          s = one(s, old_cleanup,
              '            // 固定预设/兜底答案必须保留商家在输入框中编辑的换行、连续空格和缩进；只替换变量，不重排版。\n',
              'remove whitespace normalization')
          write(p, s)

          # 3) Required-fields V2: buyer remark is a real order field and is enriched from the exact trade response.
          p = 'src/Bot/ChromeNs/OrderTemplateRequiredFieldsV2.cs'
          s = read(p)
          s = one(s,
              'using System.Windows.Controls;\nusing System.Windows.Threading;',
              'using System.Windows.Controls;\nusing System.Windows.Documents;\nusing System.Windows.Input;\nusing System.Windows.Media;\nusing System.Windows.Threading;',
              'UI namespaces')
          s = one(s,
              '            public bool TotalFound;\n            public bool BuyerSearchAttempted;',
              '            public bool TotalFound;\n            public bool BuyerRemarkFound;\n            public bool BuyerSearchAttempted;',
              'probe buyer remark')
          s = one(s,
              '        private static readonly string[] TimeKeys =\n        {\n            "paidat", "paytime", "paidtime", "paymenttime", "createdat", "createtime",\n            "ordertime", "createdtime", "tradecreatetime", "eventtime", "sendtime", "timestamp"\n        };',
              '        private static readonly string[] TimeKeys =\n        {\n            "paidat", "paytime", "paidtime", "paymenttime", "createdat", "createtime",\n            "ordertime", "createdtime", "tradecreatetime", "eventtime", "sendtime", "timestamp"\n        };\n\n        private static readonly string[] BuyerRemarkKeys =\n        {\n            "buyerremark", "buyermemo", "buyernote", "buyermessage", "buyermessagecontent",\n            "buyermsg", "remarkfrombuyer", "memofrombuyer"\n        };',
              'V2 buyer remark keys')
          s = one(s,
              '            probe.TotalFound = snapshot.TotalAmount.HasValue;',
              '            probe.TotalFound = snapshot.TotalAmount.HasValue;\n            probe.BuyerRemarkFound = !string.IsNullOrWhiteSpace(snapshot.BuyerRemark);',
              'update probe buyer remark')
          s = one(s,
              '            if ((template.Contains("{sku}") || template.Contains("{规格}"))\n                && !string.IsNullOrWhiteSpace(snapshot.SkuText)) present.Add("sku");',
              '            if ((template.Contains("{sku}") || template.Contains("{规格}"))\n                && !string.IsNullOrWhiteSpace(snapshot.SkuText)) present.Add("sku");\n            if (template.Contains("{买家备注}") && !string.IsNullOrWhiteSpace(snapshot.BuyerRemark)) present.Add("buyer_remark");',
              'V2 present buyer remark')
          s = one(s,
              '                        case "sku": reason = "trade_found_but_sku_empty"; break;\n                        case "quantity":',
              '                        case "sku": reason = "trade_found_but_sku_empty"; break;\n                        case "buyer_remark": reason = "trade_found_but_buyer_remark_empty"; break;\n                        case "quantity":',
              'V2 missing reason')
          s = one(s,
              '                || template.Contains("{订单状态}");',
              '                || template.Contains("{订单状态}")\n                || template.Contains("{买家备注}");',
              'V2 own buyer remark template')
          s = one(s,
              '            if ((template.Contains("{sku}") || template.Contains("{规格}"))\n                && (snapshot == null || string.IsNullOrWhiteSpace(snapshot.SkuText)))\n            {\n                missing.Add("sku");\n            }',
              '            if ((template.Contains("{sku}") || template.Contains("{规格}"))\n                && (snapshot == null || string.IsNullOrWhiteSpace(snapshot.SkuText)))\n            {\n                missing.Add("sku");\n            }\n            if (template.Contains("{买家备注}")\n                && (snapshot == null || string.IsNullOrWhiteSpace(snapshot.BuyerRemark)))\n            {\n                missing.Add("buyer_remark");\n            }',
              'V2 missing buyer remark')
          s = one(s,
              '            if (snapshot.Quantity <= 0 && quantity > 0) snapshot.Quantity = quantity;\n\n            var title =',
              '            if (snapshot.Quantity <= 0 && quantity > 0) snapshot.Quantity = quantity;\n\n            if (string.IsNullOrWhiteSpace(snapshot.BuyerRemark))\n            {\n                try\n                {\n                    var tradeFlat = Flatten(JObject.FromObject(trade));\n                    var buyerRemark = FindValue(tradeFlat, BuyerRemarkKeys);\n                    if (!string.IsNullOrWhiteSpace(buyerRemark)) snapshot.BuyerRemark = Safe(buyerRemark, 500);\n                }\n                catch { }\n            }\n\n            var title =',
              'enrich buyer remark from trade')
          s = one(s,
              '                OrderId = orderId,\n                TradeStatus = string.IsNullOrWhiteSpace(status)',
              '                OrderId = orderId,\n                BuyerRemark = Safe(FindValue(flat, BuyerRemarkKeys), 500),\n                TradeStatus = string.IsNullOrWhiteSpace(status)',
              'sparse buyer remark')
          s = one(s,
              '            if (!string.IsNullOrWhiteSpace(snapshot.SkuText)) sb.Append(" SKU：").Append(Safe(snapshot.SkuText, 180));\n            if (snapshot.Quantity > 0)',
              '            if (!string.IsNullOrWhiteSpace(snapshot.SkuText)) sb.Append(" SKU：").Append(Safe(snapshot.SkuText, 180));\n            if (!string.IsNullOrWhiteSpace(snapshot.BuyerRemark)) sb.Append(" 买家备注：").Append(Safe(snapshot.BuyerRemark, 300));\n            if (snapshot.Quantity > 0)',
              'safe event text buyer remark')

          # Replace the old SKU-only UI migration with a loaded-element enhancer that keeps compatibility
          # and turns every displayed order placeholder into a blue clickable insertion token.
          s = one(s,
              '        private static readonly ConditionalWeakTable<FeatureSettingsWindow, object> Enhanced =\n            new ConditionalWeakTable<FeatureSettingsWindow, object>();\n        private static int _initialized;',
              '        private static readonly ConditionalWeakTable<FeatureSettingsWindow, object> Enhanced =\n            new ConditionalWeakTable<FeatureSettingsWindow, object>();\n        private static readonly ConditionalWeakTable<TextBlock, object> EnhancedHints =\n            new ConditionalWeakTable<TextBlock, object>();\n        private static int _initialized;',
              'hint weak table')
          s = one(s,
              '            EventManager.RegisterClassHandler(\n                typeof(FeatureSettingsWindow),\n                FrameworkElement.LoadedEvent,\n                new RoutedEventHandler(OnLoaded),\n                true);',
              '            EventManager.RegisterClassHandler(\n                typeof(FeatureSettingsWindow),\n                FrameworkElement.LoadedEvent,\n                new RoutedEventHandler(OnLoaded),\n                true);\n            EventManager.RegisterClassHandler(\n                typeof(TextBlock),\n                FrameworkElement.LoadedEvent,\n                new RoutedEventHandler(OnTextBlockLoaded),\n                true);\n            EventManager.RegisterClassHandler(\n                typeof(TextBox),\n                FrameworkElement.LoadedEvent,\n                new RoutedEventHandler(OnTextBoxLoaded),\n                true);',
              'global loaded handlers')
          marker = '''        private static void Rewrite(DependencyObject root)\n        {'''
          insert = r'''        private static readonly string[] OrderTemplateTokens =
        {
            "{客服}", "{买家}", "{订单号}", "{时间}", "{商品}", "{sku}",
            "{数量}", "{金额}", "{实付}", "{订单状态}", "{买家备注}", "{分段符}"
        };

        private static void OnTextBoxLoaded(object sender, RoutedEventArgs e)
        {
            var box = sender as TextBox;
            if (box == null) return;
            if ((box.Text ?? string.Empty).Contains("{规格}"))
            {
                var caret = box.SelectionStart;
                box.Text = box.Text.Replace("{规格}", "{sku}");
                box.SelectionStart = Math.Min(caret, box.Text.Length);
                box.ToolTip = "新模板统一使用 {sku}；旧 {规格} 仍兼容。";
            }
        }

        private static void OnTextBlockLoaded(object sender, RoutedEventArgs e)
        {
            var hint = sender as TextBlock;
            if (hint == null) return;
            var value = hint.Text ?? string.Empty;
            if (value.IndexOf("支持 {客服}", StringComparison.Ordinal) < 0
                || value.IndexOf("接口失败", StringComparison.Ordinal) < 0) return;
            object marker;
            if (EnhancedHints.TryGetValue(hint, out marker)) return;

            var target = FindOrderTemplateTextBox(hint);
            if (target == null) return;
            EnhancedHints.Add(hint, new object());
            RewritePlaceholderHint(hint, target);
        }

        private static void RewritePlaceholderHint(TextBlock hint, TextBox target)
        {
            hint.Inlines.Clear();
            hint.TextWrapping = TextWrapping.Wrap;
            hint.Inlines.Add(new Run("支持 "));
            var blue = new SolidColorBrush(Color.FromRgb(37, 99, 235));
            for (var i = 0; i < OrderTemplateTokens.Length; i++)
            {
                if (i > 0) hint.Inlines.Add(new Run("、"));
                var token = OrderTemplateTokens[i];
                var link = new Hyperlink(new Run(token))
                {
                    Foreground = blue,
                    Cursor = Cursors.Hand,
                    TextDecorations = null,
                    ToolTip = "点击插入 " + token
                };
                link.Click += delegate { InsertAtCaret(target, token); };
                hint.Inlines.Add(link);
            }
            hint.Inlines.Add(new Run("。点击蓝色变量可插入到当前光标处；分段符会拆成多条千牛消息依次发送；接口失败时也会使用这段话兜底。"));
        }

        private static void InsertAtCaret(TextBox box, string token)
        {
            if (box == null || string.IsNullOrEmpty(token)) return;
            var value = box.Text ?? string.Empty;
            var start = Math.Max(0, Math.Min(box.SelectionStart, value.Length));
            var length = Math.Max(0, Math.Min(box.SelectionLength, value.Length - start));
            box.Text = value.Remove(start, length).Insert(start, token);
            box.SelectionStart = start + token.Length;
            box.SelectionLength = 0;
            box.Focus();
        }

        private static TextBox FindOrderTemplateTextBox(DependencyObject start)
        {
            var cfg = BotFeatureStore.GetAutoReplyRules();
            var configured = cfg == null ? string.Empty : (cfg.OrderPlacedReplyText ?? string.Empty);
            DependencyObject current = start;
            for (var depth = 0; current != null && depth < 10; depth++)
            {
                var boxes = Descendants(current).OfType<TextBox>().Where(x => x.AcceptsReturn).ToList();
                var exact = boxes.FirstOrDefault(x => string.Equals(x.Text ?? string.Empty, configured, StringComparison.Ordinal));
                if (exact != null) return exact;
                if (boxes.Count == 1) return boxes[0];
                current = ParentOf(current);
            }
            return null;
        }

        private static IEnumerable<DependencyObject> Descendants(DependencyObject root)
        {
            foreach (var child in LogicalChildren(root))
            {
                yield return child;
                foreach (var nested in Descendants(child)) yield return nested;
            }
        }

        private static DependencyObject ParentOf(DependencyObject value)
        {
            if (value == null) return null;
            try
            {
                var logical = LogicalTreeHelper.GetParent(value);
                if (logical != null) return logical;
            }
            catch { }
            try { return VisualTreeHelper.GetParent(value); }
            catch { return null; }
        }

'''
          if marker not in s:
              raise SystemExit('UI marker not found')
          s = s.replace(marker, insert + marker, 1)
          write(p, s)

          # 4) Send layer: {分段符} becomes sequential messages; raw segments are not trimmed/reformatted.
          p = 'src/Bot/ChromeNs/QN.cs'
          s = read(p)
          old = '''        public async Task<bool> SendTextWithRetryAsync(string buyer, string text, int retryCount = 1)\n        {\n            await _sendGate.WaitAsync();'''
          new = '''        public async Task<bool> SendTextWithRetryAsync(string buyer, string text, int retryCount = 1)\n        {\n            const string segmentToken = "{分段符}";\n            if (!string.IsNullOrEmpty(text) && text.IndexOf(segmentToken, StringComparison.Ordinal) >= 0)\n            {\n                var segments = text.Split(new[] { segmentToken }, StringSplitOptions.None)\n                    .Where(x => !string.IsNullOrWhiteSpace(x))\n                    .ToList();\n                if (segments.Count == 0) return false;\n                for (var segmentIndex = 0; segmentIndex < segments.Count; segmentIndex++)\n                {\n                    var segment = segments[segmentIndex];\n                    Log.Info("分段自动发送: buyer=" + buyer + ", segment=" + (segmentIndex + 1) + "/" + segments.Count);\n                    if (!await SendTextWithRetryAsync(buyer, segment, retryCount)) return false;\n                    if (segmentIndex + 1 < segments.Count) await Task.Delay(220);\n                }\n                return true;\n            }\n\n            await _sendGate.WaitAsync();'''
          s = one(s, old, new, 'segment send')
          write(p, s)

          # 5) Static regression coverage.
          Path('tests/test_order_reply_template_placeholders_v3_static.py').write_text(r'''from pathlib import Path

SERVICE = Path("src/Bot/ChromeNs/OrderPlacedAutoReplyService.cs").read_text(encoding="utf-8-sig")
HUB = Path("src/Bot/ChromeNs/OrderEventHub.cs").read_text(encoding="utf-8-sig")
V2 = Path("src/Bot/ChromeNs/OrderTemplateRequiredFieldsV2.cs").read_text(encoding="utf-8-sig")
QN = Path("src/Bot/ChromeNs/QN.cs").read_text(encoding="utf-8-sig")


def test_supported_tokens_include_new_real_order_fields():
    assert '"{sku}"' in V2
    assert '"{买家备注}"' in V2
    assert '"{分段符}"' in V2
    assert 'public string BuyerRemark { get; set; }' in HUB
    for key in ("buyerremark", "buyermemo", "buyernote", "buyermessage", "remarkfrombuyer", "memofrombuyer"):
        assert f'"{key}"' in HUB
    assert '"remark"' not in HUB.split('BuyerRemarkKeys', 1)[1].split('};', 1)[0]
    assert '"memo"' not in HUB.split('BuyerRemarkKeys', 1)[1].split('};', 1)[0]


def test_template_preserves_authored_layout():
    assert 'Regex.Replace(rendered, @"[ \\t]{2,}", " ")' not in SERVICE
    assert 'Regex.Replace(rendered, @"(?m)[ \\t]+$", string.Empty).Trim()' not in SERVICE
    assert '.Replace("{买家备注}", snapshot == null ? string.Empty : snapshot.BuyerRemark ?? string.Empty)' in SERVICE


def test_segment_token_sends_sequentially_without_trim():
    assert 'text.Split(new[] { segmentToken }, StringSplitOptions.None)' in QN
    assert 'var segment = segments[segmentIndex];' in QN
    assert 'await SendTextWithRetryAsync(buyer, segment, retryCount)' in QN
    block = QN.split('const string segmentToken = "{分段符}";', 1)[1].split('await _sendGate.WaitAsync();', 1)[0]
    assert '.Trim()' not in block


def test_placeholder_hint_is_blue_clickable_and_caret_aware():
    assert 'Color.FromRgb(37, 99, 235)' in V2
    assert 'new Hyperlink(new Run(token))' in V2
    assert 'link.Click += delegate { InsertAtCaret(target, token); };' in V2
    assert 'box.SelectionStart' in V2
    assert 'box.SelectionLength' in V2


def test_buyer_remark_enrichment_is_strict_and_real_only():
    assert 'FindValue(tradeFlat, BuyerRemarkKeys)' in V2
    assert 'FindValue(flat, BuyerRemarkKeys)' in V2
    assert 'trade_found_but_buyer_remark_empty' in V2
''', encoding='utf-8')
          PY

      - name: Run targeted regression tests
        run: python -m pytest -q tests/test_order_reply_template_placeholders_v3_static.py tests/test_late_order_panel_recovery_static.py

      - name: Commit patched source to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/OrderEventHub.cs src/Bot/ChromeNs/OrderPlacedAutoReplyService.cs src/Bot/ChromeNs/OrderTemplateRequiredFieldsV2.cs src/Bot/ChromeNs/QN.cs tests/test_order_reply_template_placeholders_v3_static.py
          git diff --cached --check
          git commit -m "feat: enhance order auto-reply template variables"
          git push origin HEAD:master
