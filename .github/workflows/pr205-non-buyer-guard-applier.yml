name: PR205 non-buyer guard applier

on:
  push:
    branches:
      - fix/non-buyer-conversation-guard-20260902

permissions:
  contents: write

concurrency:
  group: pr205-non-buyer-guard-applier
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/non-buyer-conversation-guard-20260902
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply guarded source patch
        run: python scripts/dev/apply_non_buyer_guard_20260902.py

      - name: Run focused non-buyer regressions
        run: |
          python -m pytest -q \
            tests/test_non_buyer_conversation_guard_static.py \
            tests/test_local_first_reply_mode_static.py \
            tests/test_order_event_attention_static.py \
            tests/test_runtime_send_failure_1088_static.py

      - name: Commit real source changes and remove applier
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/dev/apply_non_buyer_guard_20260902.py
          rm -f .github/workflows/pr205-non-buyer-guard-applier.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: ignore non-buyer qianniu conversations'
          git push origin HEAD:fix/non-buyer-conversation-guard-20260902
