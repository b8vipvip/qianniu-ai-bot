name: Patch order template UI updater

on:
  push:
    branches:
      - fix/order-template-ui-updater-ps51

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-template-ui-updater-ps51
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic patch
        run: python scripts/patch_order_template_ui_updater.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/App.xaml.cs src/Bot/Update/BotAutoUpdater.ps1
          git commit -m "fix: activate order template placeholders and PS5 updater"
          git push origin HEAD:fix/order-template-ui-updater-ps51
