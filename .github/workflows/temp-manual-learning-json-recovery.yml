name: temp manual learning json recovery patch

on:
  push:
    branches:
      - fix/manual-learning-json-recovery-20260902

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-learning-json-recovery-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production patch
        run: python .github/scripts/temp_patch_manual_learning_json.py
      - name: Run focused regression
        run: python -m pytest -q tests/test_manual_learning_json_recovery_static.py
      - name: Run repository static regressions
        run: python -m pytest -q tests
      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-manual-learning-json-recovery.yml
          git rm .github/scripts/temp_patch_manual_learning_json.py
          git add src/Bot/ChromeNs/KnowledgeLearningService.cs tests/test_manual_learning_json_recovery_static.py
          git commit -m "fix: recover malformed manual learning JSON safely"
          git push origin HEAD:fix/manual-learning-json-recovery-20260902
