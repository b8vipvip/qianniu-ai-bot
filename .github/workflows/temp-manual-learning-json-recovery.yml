name: temp manual learning json recovery patch

on:
  push:
    branches:
      - fix/manual-learning-json-recovery-20260902

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-learning-json-recovery-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Bot/ChromeNs/KnowledgeLearningService.cs')
          text = path.read_text(encoding='utf-8-sig')

          old_compare = '''            var parsed = ParseObject(result.Answer);
            bool shouldLearn;'''
          new_compare = '''            JObject parsed;
            if (!TryParseObject(result.Answer, out parsed))
            {
                MessageProcessingTraceService.RecordLearningComparison(
                    seller,
                    buyer,
                    "skipped",
                    "AI对比结果不是可恢复的结构化JSON，本次不修改知识。",
                    true);
                return;
            }
            bool shouldLearn;'''
          if old_compare not in text:
              raise SystemExit('manual comparison parse anchor not found')
          text = text.replace(old_compare, new_compare, 1)

          old_parser = '''        private static JObject ParseObject(string text)
        {
            text = (text ?? string.Empty).Trim();
            var start = text.IndexOf('{');
            var end = text.LastIndexOf('}');
            if (start < 0 || end <= start) throw new Exception("未找到JSON对象");
            return JObject.Parse(text.Substring(start, end - start + 1));
        }
'''
          new_parser = r'''        private static JObject ParseObject(string text)
        {
            JObject result;
            if (TryParseObject(text, out result)) return result;
            throw new Exception("AI结构化结果无法恢复有效JSON对象（已尝试纯JSON、Markdown代码块、包装对象/数组、字符串包裹和括号平衡恢复）");
        }

        private static bool TryParseObject(string text, out JObject result)
        {
            result = null;
            text = (text ?? string.Empty).Trim();
            if (text.Length == 0) return false;

            if (TryParseObjectCandidate(text, 0, out result)) return true;

            foreach (Match fence in Regex.Matches(
                text,
                @"```(?:json)?\s*(?<body>[\s\S]*?)```",
                RegexOptions.IgnoreCase))
            {
                if (TryParseObjectCandidate(fence.Groups["body"].Value, 0, out result)) return true;
            }

            foreach (var candidate in ExtractBalancedJsonObjects(text))
            {
                if (TryParseObjectCandidate(candidate, 0, out result)) return true;
            }
            return false;
        }

        private static bool TryParseObjectCandidate(string candidate, int depth, out JObject result)
        {
            result = null;
            candidate = (candidate ?? string.Empty).Trim();
            if (candidate.Length == 0 || depth > 5) return false;
            try
            {
                var token = JToken.Parse(candidate);
                return TrySelectLearningObject(token, depth, out result);
            }
            catch
            {
                return false;
            }
        }

        private static bool TrySelectLearningObject(JToken token, int depth, out JObject result)
        {
            result = null;
            if (token == null || depth > 5) return false;

            var obj = token as JObject;
            if (obj != null)
            {
                if (HasLearningObjectShape(obj))
                {
                    result = obj;
                    return true;
                }
                foreach (var property in obj.Properties())
                {
                    if (TrySelectLearningObject(property.Value, depth + 1, out result)) return true;
                }
                return false;
            }

            var array = token as JArray;
            if (array != null)
            {
                foreach (var child in array)
                {
                    if (TrySelectLearningObject(child, depth + 1, out result)) return true;
                }
                return false;
            }

            if (token.Type != JTokenType.String) return false;
            var nestedText = Convert.ToString(((JValue)token).Value);
            if (string.IsNullOrWhiteSpace(nestedText)) return false;

            if (TryParseObjectCandidate(nestedText, depth + 1, out result)) return true;
            foreach (Match fence in Regex.Matches(
                nestedText,
                @"```(?:json)?\s*(?<body>[\s\S]*?)```",
                RegexOptions.IgnoreCase))
            {
                if (TryParseObjectCandidate(fence.Groups["body"].Value, depth + 1, out result)) return true;
            }
            foreach (var candidate in ExtractBalancedJsonObjects(nestedText))
            {
                if (TryParseObjectCandidate(candidate, depth + 1, out result)) return true;
            }
            return false;
        }

        private static bool HasLearningObjectShape(JObject obj)
        {
            if (obj == null) return false;
            var hasQuestion = obj["question"] != null;
            var hasAnswer = obj["answer"] != null;
            var hasReviewDecision = obj["should_learn"] != null || obj["action"] != null;
            return (hasQuestion && hasAnswer) || (hasReviewDecision && hasAnswer);
        }

        private static List<string> ExtractBalancedJsonObjects(string text)
        {
            var result = new List<string>();
            text = text ?? string.Empty;
            var start = -1;
            var depth = 0;
            var inString = false;
            var escaped = false;

            for (var i = 0; i < text.Length; i++)
            {
                var ch = text[i];
                if (inString)
                {
                    if (escaped)
                    {
                        escaped = false;
                        continue;
                    }
                    if (ch == '\\')
                    {
                        escaped = true;
                        continue;
                    }
                    if (ch == '"') inString = false;
                    continue;
                }

                if (ch == '"')
                {
                    inString = true;
                    continue;
                }
                if (ch == '{')
                {
                    if (depth == 0) start = i;
                    depth++;
                    continue;
                }
                if (ch != '}' || depth <= 0) continue;

                depth--;
                if (depth == 0 && start >= 0)
                {
                    result.Add(text.Substring(start, i - start + 1));
                    start = -1;
                    if (result.Count >= 12) break;
                }
            }
            return result;
        }
'''
          if old_parser not in text:
              raise SystemExit('legacy parser anchor not found')
          text = text.replace(old_parser, new_parser, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused regression
        run: python -m pytest -q tests/test_manual_learning_json_recovery_static.py
      - name: Run repository static regressions
        run: python -m pytest -q tests
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-manual-learning-json-recovery.yml
          git add src/Bot/ChromeNs/KnowledgeLearningService.cs tests/test_manual_learning_json_recovery_static.py
          git commit -m "fix: recover malformed manual learning JSON safely"
          git push origin HEAD:fix/manual-learning-json-recovery-20260902
