name: One-off order status template patch

on:
  push:
    branches:
      - fix/order-status-template-1083
    paths:
      - .github/workflows/oneoff-patch-order-status-template.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-status-template-1083
          fetch-depth: 0
      - name: Patch customer-facing order status rendering
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("src/Bot/ChromeNs/OrderPlacedAutoReplyService.cs")
          service = service_path.read_text(encoding="utf-8-sig")
          old = '                .Replace("{订单状态}", snapshot == null ? string.Empty : snapshot.TradeStatus ?? string.Empty);'
          new = '                .Replace("{订单状态}", FormatTradeStatusForTemplate(snapshot));'
          if old not in service:
              raise SystemExit("expected raw TradeStatus template renderer not found")
          service = service.replace(old, new, 1)

          marker = '        private static OrderPlacedReplyResolution Fail(string error)'
          helper = '''        private static string FormatTradeStatusForTemplate(OrderSnapshot snapshot)
          {
              if (snapshot == null) return string.Empty;
              var raw = (snapshot.TradeStatus ?? string.Empty).Trim();
              var key = Regex.Replace(raw, @"[\\s_-]", string.Empty).ToLowerInvariant();
              switch (key)
              {
                  case "tradebuyerpay":
                  case "waitsellersendgoods":
                      return "已付款";
                  case "waitbuyerpay":
                  case "tradenocreatepay":
                      return "待付款";
                  case "waitbuyerconfirmgoods":
                  case "sellerconsignedpart":
                      return "已发货";
                  case "tradefinished":
                  case "tradesuccess":
                      return "交易完成";
                  case "tradeclosed":
                  case "tradeclosedbytaobao":
                      return "已关闭";
              }
              if (snapshot.EventType == OrderEventType.Paid || snapshot.IsPaid == true) return "已付款";
              if (snapshot.EventType == OrderEventType.RefundRequested) return "退款中";
              if (snapshot.EventType == OrderEventType.Closed) return "已关闭";
              if (snapshot.EventType == OrderEventType.Created) return "已下单";
              return raw;
          }

'''
          if marker not in service:
              raise SystemExit("helper insertion marker not found")
          service = service.replace(marker, helper + marker, 1)
          service_path.write_text(service, encoding="utf-8-sig")

          test_path = Path("tests/test_order_reply_template_placeholders_v3_static.py")
          test = test_path.read_text(encoding="utf-8-sig")
          addition = '''\n\ndef test_order_status_placeholder_is_customer_facing_not_qianniu_internal_code():
    assert '.Replace("{订单状态}", FormatTradeStatusForTemplate(snapshot))' in SERVICE
    assert 'case "tradebuyerpay":' in SERVICE
    assert 'case "waitbuyerpay":' in SERVICE
    assert 'case "waitbuyerconfirmgoods":' in SERVICE
    assert 'case "tradefinished":' in SERVICE
    assert 'case "tradeclosed":' in SERVICE
    assert 'return "已付款";' in SERVICE
    assert 'return "待付款";' in SERVICE
    assert 'return "已发货";' in SERVICE
    assert 'return "交易完成";' in SERVICE
    assert 'return "已关闭";' in SERVICE
    render = SERVICE.split("private static string RenderTemplate", 1)[1].split("private static string FormatTradeStatusForTemplate", 1)[0]
    assert 'snapshot.TradeStatus ?? string.Empty' not in render
'''
          if "test_order_status_placeholder_is_customer_facing_not_qianniu_internal_code" not in test:
              test_path.write_text(test.rstrip() + addition + "\n", encoding="utf-8-sig")
      - name: Run focused regression test
        run: python -m pytest -q tests/test_order_reply_template_placeholders_v3_static.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/OrderPlacedAutoReplyService.cs tests/test_order_reply_template_placeholders_v3_static.py
          git diff --cached --check
          git commit -m "fix: render order status as customer-facing text"
          git push origin HEAD:fix/order-status-template-1083
