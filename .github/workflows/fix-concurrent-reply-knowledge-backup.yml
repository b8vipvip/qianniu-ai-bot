name: Fix concurrent reply and knowledge backup patch

on:
  push:
    branches:
      - feat/concurrent-reply-knowledge-backup-20260824

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/concurrent-reply-knowledge-backup-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply fixes and tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python tools/fix_concurrent_reply_knowledge_backup_patch.py
          python -m pytest -q tests/test_concurrent_reply_knowledge_backup_static.py tests/test_local_first_reply_mode_static.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/fix_concurrent_reply_knowledge_backup_patch.py .github/workflows/fix-concurrent-reply-knowledge-backup.yml
          git add src/Bot/Knowledge/RulePolicyImportExportUi.cs
          git commit -m "fix: harden knowledge package import context"
          git push origin HEAD:feat/concurrent-reply-knowledge-backup-20260824
