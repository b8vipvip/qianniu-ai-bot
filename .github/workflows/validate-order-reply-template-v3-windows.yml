name: Validate order reply template v3 Windows

on:
  push:
    branches: [ agent/order-reply-template-v3 ]
    paths: [ '.github/workflows/validate-order-reply-template-v3-windows.yml' ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/order-reply-template-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uiautomation pytest
      - name: Run repository static tests
        shell: pwsh
        run: python -m pytest -q tests
      - uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore src/Bot.sln -PackagesDirectory src/packages -NonInteractive
      - name: Build Bot solution x64
        shell: pwsh
        run: |
          msbuild src/Bot.sln /t:Build /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record validation success
        shell: pwsh
        run: |
          Set-Content -LiteralPath ci-order-reply-template-v3-success.txt -Value "Windows x64 tests and build passed $env:GITHUB_SHA" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-order-reply-template-v3-success.txt
          git commit -m "ci: record order reply template v3 Windows validation"
          git push origin HEAD:agent/order-reply-template-v3
