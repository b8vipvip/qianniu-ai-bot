name: One-shot fixed-reply compatibility patch

on:
  push:
    branches:
      - fix/runtime-stale-generation-qnbot-rename-20260905

permissions:
  contents: write

jobs:
  patch-fixed-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Keep pre-merge greetings state-neutral
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              raw = p.read_bytes()
              bom = raw.startswith(b"\xef\xbb\xbf")
              text = raw.decode("utf-8-sig")
              if old not in text:
                  raise SystemExit("expected fragment missing in " + path)
              text = text.replace(old, new, 1)
              p.write_bytes((b"\xef\xbb\xbf" if bom else b"") + text.encode("utf-8"))

          ready_old = "!sessionAgent.TryTransition(\n                    item.SellerNick,\n                    item.BuyerNick,\n                    item.SessionGeneration,\n                    BuyerSessionAgentState.Ready,\n                    \"fixed_reply_ready\")"
          ready_new = "!sessionAgent.IsCurrent(item.SellerNick, item.BuyerNick, item.SessionGeneration)"
          sending_old = "!sessionAgent.TryTransition(\n                        item.SellerNick,\n                        item.BuyerNick,\n                        item.SessionGeneration,\n                        BuyerSessionAgentState.Sending,\n                        \"fixed_reply_sending\")"
          sending_new = "!sessionAgent.IsCurrent(item.SellerNick, item.BuyerNick, item.SessionGeneration)"
          replace_once("src/Bot/ChromeNs/DeterministicAutoReplyService.cs", ready_old, ready_new)
          replace_once("src/Bot/ChromeNs/DeterministicAutoReplyService.cs", sending_old, sending_new)

          coordinator = "src/Bot/ChromeNs/BuyerMessageBurstCoordinator.cs"
          replace_once(coordinator, "// The deterministic service owns the only same-buyer gate. Its bounded 1.8s", "// The deterministic service owns the only same-buyer gate. Ordinary fixed rules")
          replace_once(coordinator, "// acquisition fails open for later generations, so an unhealthy fixed send can", "// wait with the current generation cancellation token instead of timing out into AI;")
          replace_once(coordinator, "// no longer strand the whole buyer in Coalescing. We deliberately await the", "// explicit generation invalidation is the bounded escape path. We deliberately await the")
          print("fixed-reply generation gate patch applied")
          PY

      - name: Commit fixed-reply patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep pre-merge fixed replies state-neutral [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
