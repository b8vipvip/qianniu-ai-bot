name: One-shot fixed-reply compatibility patch

on:
  push:
    branches:
      - fix/runtime-stale-generation-qnbot-rename-20260905

permissions:
  contents: write

jobs:
  patch-fixed-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Keep pre-merge greetings from advancing the shared generation state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              raw = p.read_bytes()
              bom = raw.startswith(b"\xef\xbb\xbf")
              text = raw.decode("utf-8-sig")
              if old not in text:
                  raise SystemExit(f"expected fragment missing in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_bytes((b"\xef\xbb\xbf" if bom else b"") + text.encode("utf-8"))

          path = "src/Bot/ChromeNs/DeterministicAutoReplyService.cs"
          replace_once(path,
          '''            var sessionAgent = new BuyerSessionAgent();
            if (item.SessionGeneration > 0
                && !sessionAgent.TryTransition(
                    item.SellerNick,
                    item.BuyerNick,
                    item.SessionGeneration,
                    BuyerSessionAgentState.Ready,
                    "fixed_reply_ready"))
            {
                Log.Info(source + "生成结果到达时generation已失效，禁止记录Ready和真实发送: seller="
                    + item.SellerNick + ", buyer=" + item.BuyerNick
                    + ", generation=" + item.SessionGeneration);
                return false;
            }
''',
          '''            var sessionAgent = new BuyerSessionAgent();
            if (item.SessionGeneration > 0
                && !sessionAgent.IsCurrent(item.SellerNick, item.BuyerNick, item.SessionGeneration))
            {
                Log.Info(source + "生成结果到达时generation已失效，禁止记录答案和真实发送: seller="
                    + item.SellerNick + ", buyer=" + item.BuyerNick
                    + ", generation=" + item.SessionGeneration);
                return false;
            }
''')

          replace_once(path,
          '''                if (item.SessionGeneration > 0
                    && !sessionAgent.TryTransition(
                        item.SellerNick,
                        item.BuyerNick,
                        item.SessionGeneration,
                        BuyerSessionAgentState.Sending,
                        "fixed_reply_sending"))
                {
                    if (ctl != null) ctl.SetSendResult(false, "generation已失效，禁止发送迟到固定回复");
                    Log.Info(source + "进入真实发送前generation已失效，已阻止迟到回复: seller="
                        + item.SellerNick + ", buyer=" + item.BuyerNick
                        + ", generation=" + item.SessionGeneration);
                    return false;
                }
''',
          '''                if (item.SessionGeneration > 0
                    && !sessionAgent.IsCurrent(item.SellerNick, item.BuyerNick, item.SessionGeneration))
                {
                    if (ctl != null) ctl.SetSendResult(false, "generation已失效，禁止发送迟到固定回复");
                    Log.Info(source + "进入真实发送前generation已失效，已阻止迟到回复: seller="
                        + item.SellerNick + ", buyer=" + item.BuyerNick
                        + ", generation=" + item.SessionGeneration);
                    return false;
                }
''')

          replace_once("src/Bot/ChromeNs/BuyerMessageBurstCoordinator.cs",
          '''                    // The deterministic service owns the only same-buyer gate. Its bounded 1.8s
                    // acquisition fails open for later generations, so an unhealthy fixed send can
                    // no longer strand the whole buyer in Coalescing. We deliberately await the
                    // selected rule task here: starting AI while that task can still send would
                    // create a duplicate/out-of-order side-effect race.
''',
          '''                    // The deterministic service owns the only same-buyer gate. Ordinary fixed
                    // rules now wait with the current generation cancellation token rather than
                    // timing out and fail-opening into AI. We deliberately await the selected rule
                    // task here: starting AI while that task can still send would create a
                    // duplicate/out-of-order side-effect race.
''')
          print("fixed-reply generation gate patch applied")
          PY

      - name: Commit fixed-reply patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep pre-merge fixed replies state-neutral [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
