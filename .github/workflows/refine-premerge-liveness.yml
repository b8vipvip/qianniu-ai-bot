name: Refine premerge liveness

on:
  push:
    branches:
      - fix/contextual-followup-coalescing-20260902
    paths:
      - tools/refine_premerge_liveness.py
      - .github/workflows/refine-premerge-liveness.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contextual-followup-coalescing-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply safe refinement
        run: python tools/refine_premerge_liveness.py
      - name: Run focused regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_contextual_followup_coalescing_static.py \
            tests/test_humanlike_burst_static.py \
            tests/test_send_delivery_and_burst_regressions_static.py \
            tests/test_non_buyer_conversation_guard_static.py \
            tests/test_current_buyer_health_watchdog_static.py \
            tests/test_runtime_1095_context_order_ocr_static.py
      - name: Run full repository static regressions
        run: python -m pytest -q tests
      - name: Commit production refinement and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/refine_premerge_liveness.py .github/workflows/refine-premerge-liveness.yml
          git add src tests
          git commit -m 'fix: keep deterministic side effects single-flight'
          git push origin HEAD:fix/contextual-followup-coalescing-20260902
