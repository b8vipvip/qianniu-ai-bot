name: Apply conversation progress guard

on:
  push:
    branches:
      - fix/conversation-progress-and-import-export-ui
    paths:
      - .github/scripts/apply_conversation_progress_guard.py
      - .github/workflows/apply-conversation-progress-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conversation-progress-and-import-export-ui
          fetch-depth: 0
      - name: Apply source integration
        run: python .github/scripts/apply_conversation_progress_guard.py
      - name: Install tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_conversation_progress_guard_static.py
          tests/test_rule_policy_import_export_static.py
          tests/test_smart_reply_router_store_prompt_static.py
          tests/test_smart_reply_engine_v2_phase3_static.py
      - name: Commit source changes
        run: |
          rm -f .github/scripts/apply_conversation_progress_guard.py
          rm -f .github/workflows/apply-conversation-progress-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep replies aligned with completed conversation steps"
          git push origin HEAD:fix/conversation-progress-and-import-export-ui
