name: Apply runtime stability 1077 CI follow-up

on:
  push:
    branches:
      - fix/runtime-stability-1077
    paths:
      - scripts/apply_runtime_stability_1077_ci_followup.py
      - .github/workflows/runtime-stability-1077-ci-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-stability-1077
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply guarded compile/regression patch
        run: python scripts/apply_runtime_stability_1077_ci_followup.py

      - name: Run full repository static tests
        run: python -m pytest -q tests

      - name: Commit repaired project wiring and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply_runtime_stability_1077_ci_followup.py .github/workflows/runtime-stability-1077-ci-followup.yml
          git add -A
          git diff --cached --stat
          git commit -m "Wire delivery verification into build and refresh runtime regressions"
          git push origin HEAD:fix/runtime-stability-1077
