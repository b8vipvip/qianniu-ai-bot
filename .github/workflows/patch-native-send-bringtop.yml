name: One-time native HWND focus patch

on:
  push:
    branches:
      - fix/cdp-native-send-integrity-20260817

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cdp-native-send-integrity-20260817
          fetch-depth: 0
      - name: Bring verified seller window top before WindowFromPoint
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/Bot/ChromeNs/QNRpa.NativeSend.cs')
          text = path.read_text(encoding='utf-8-sig')
          text = text.replace('using System.Runtime.InteropServices;\nusing System.Threading.Tasks;', 'using System.Runtime.InteropServices;\nusing System.Threading;\nusing System.Threading.Tasks;', 1)
          old = 'var desk = ResolveSellerDesk();\n            if (desk == null || !EnsureSellerDeskBinding(false)) return false;\n\n            var rect = _sendMessageButtonRect;'
          new = 'var desk = ResolveSellerDesk();\n            if (desk == null || !EnsureSellerDeskBinding(false)) return false;\n\n            // WindowFromPoint must observe the verified seller window rather than a settings/dialog\n            // window that happens to cover the same screen coordinate. This is not a send action.\n            desk.BringTop();\n            Thread.Sleep(100);\n\n            var rect = _sendMessageButtonRect;'
          if old not in text:
              raise SystemExit('native HWND anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8-sig')
          Path('.github/workflows/patch-native-send-bringtop.yml').unlink()
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/QNRpa.NativeSend.cs .github/workflows/patch-native-send-bringtop.yml
          git commit -m "fix: foreground verified seller before HWND send"
          git push origin HEAD:fix/cdp-native-send-integrity-20260817
