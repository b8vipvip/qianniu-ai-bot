name: Windows x64 release build

# Preserve the established Bin + data deployment layout.
# User-specific params.db is never published.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - integration/master-candidate
      - vaxsh7-codex/api
      - agent/uia-send-control-diagnostics
  push:
    branches:
      - master
      - integration/master-candidate
      - vaxsh7-codex/api
      - agent/uia-send-control-diagnostics

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uiautomation pytest

      - name: Compile Python tools
        shell: pwsh
        run: |
          python -m py_compile `
            tools/qn_discovery_lab/qn_uia_extract_messages_core.py `
            tools/qn_discovery_lab/qn_uia_extract_messages.py `
            tools/qn_discovery_lab/qn_uia_message_lifecycle.py `
            tools/qn_discovery_lab/qn_uia_lifecycle_probe.py `
            tools/qn_discovery_lab/qn_uia_withdraw_exact_probe.py

      - name: Run lifecycle tests
        shell: pwsh
        run: python -m unittest discover -s tools/qn_discovery_lab/tests

      - name: Run repository static tests
        shell: pwsh
        run: python -m pytest -q tests

      - name: Validate updater with Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'src\Bot\Update\BotAutoUpdater.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw "BotAutoUpdater.ps1 has Windows PowerShell 5.1 parser errors."
          }
          Write-Host 'BotAutoUpdater.ps1 Windows PowerShell 5.1 syntax check passed.'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore src/Bot.sln -PackagesDirectory src/packages -NonInteractive

      - name: Build Bot solution x64
        shell: pwsh
        run: |
          msbuild src/Bot.sln `
            /t:Build `
            /m `
            /nologo `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /bl:msbuild.binlog `
            '/flp:logfile=msbuild.log;verbosity=diagnostic'
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host '--- MSBuild errors ---'
            Select-String -Path msbuild.log -Pattern ': error ',' error CS',' error MSB' |
              Select-Object -Last 120 |
              ForEach-Object { Write-Host $_.Line }
            exit $code
          }

      - name: Upload MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-diagnostics-x64-${{ github.sha }}
          path: |
            msbuild.log
            msbuild.binlog
          if-no-files-found: warn
          retention-days: 14

      - name: Build multilingual local OCR worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workerOut = Join-Path $env:RUNNER_TEMP 'qianniu-local-ocr'
          Remove-Item -LiteralPath $workerOut -Recurse -Force -ErrorAction SilentlyContinue

          dotnet publish tools/LocalOcrWorker/LocalOcrWorker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o $workerOut
          if ($LASTEXITCODE -ne 0) { throw 'LocalOcrWorker publish failed.' }

          $modelDir = Join-Path $workerOut 'models\v6'
          New-Item -ItemType Directory -Path $modelDir -Force | Out-Null

          $downloads = @(
            @{
              Name = 'PP-OCRv6_det_small.onnx'
              Uri = 'https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv6/det/PP-OCRv6_det_small.onnx'
              Sha256 = '090f04abcd9d9a7498bc4ebf677e4cb9bdce1fe4197ddb7e529f1ef44e1ff94f'
            },
            @{
              Name = 'PP-OCRv6_rec_small.onnx'
              Uri = 'https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv6/rec/PP-OCRv6_rec_small.onnx'
              Sha256 = '6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884'
            }
          )

          foreach ($item in $downloads) {
            $target = Join-Path $modelDir $item.Name
            Invoke-WebRequest -Uri $item.Uri -OutFile $target -UseBasicParsing
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $item.Sha256) {
              throw "OCR model hash mismatch: $($item.Name) expected=$($item.Sha256) actual=$actual"
            }
          }

          $dictUri = 'https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/paddle/PP-OCRv6/rec/PP-OCRv6_rec_small/ppocrv6_dict.txt'
          Invoke-WebRequest -Uri $dictUri -OutFile (Join-Path $modelDir 'ppocrv6_small_dict.txt') -UseBasicParsing

          $requiredOcr = @(
            (Join-Path $workerOut 'LocalOcrWorker.exe'),
            (Join-Path $modelDir 'PP-OCRv6_det_small.onnx'),
            (Join-Path $modelDir 'PP-OCRv6_rec_small.onnx'),
            (Join-Path $modelDir 'ppocrv6_small_dict.txt'),
            (Join-Path $workerOut 'models\v5\ch_PP-LCNet_x0_25_textline_ori_cls_mobile.onnx')
          )
          foreach ($path in $requiredOcr) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required OCR runtime file not found: $path"
            }
          }

          Write-Host "Local OCR worker ready: $workerOut"
          Get-ChildItem -LiteralPath $workerOut -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ('Local OCR package bytes: ' + $_.Sum) }

      - name: Assemble complete runtime package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD 'package'
          $packageBin = Join-Path $packageRoot 'Bin'
          $packageData = Join-Path $packageRoot 'data'
          $releaseBin = Join-Path $PWD 'src\Bot\bin\x64\Release'
          $baselineBin = Join-Path $PWD 'src\Bin'
          $sourceData = Join-Path $PWD 'src\data'
          $workerOut = Join-Path $env:RUNNER_TEMP 'qianniu-local-ocr'
          $ocrDestination = Join-Path $packageBin 'local-ocr'

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $packageBin -Force | Out-Null
          New-Item -ItemType Directory -Path $packageData -Force | Out-Null

          Copy-Item -Path (Join-Path $baselineBin '*') `
            -Destination $packageBin -Recurse -Force

          Copy-Item -Path (Join-Path $releaseBin '*') `
            -Destination $packageBin -Recurse -Force

          New-Item -ItemType Directory -Path $ocrDestination -Force | Out-Null
          Copy-Item -Path (Join-Path $workerOut '*') `
            -Destination $ocrDestination -Recurse -Force

          if (Test-Path -LiteralPath $sourceData -PathType Container) {
            Get-ChildItem -LiteralPath $sourceData -Force |
              Where-Object { $_.Name -ne 'params.db' } |
              Copy-Item -Destination $packageData -Recurse -Force
          }

          @(
            'This package preserves the established Bin + data directory layout.',
            '',
            'params.db is intentionally excluded because it contains local user',
            'configuration and runtime state.',
            '',
            'Back up your existing data directory before testing.',
            'Copy only your own params.db into this package data directory.',
            'Do not commit or upload params.db.'
          ) | Set-Content `
            -LiteralPath (Join-Path $packageData 'README-PARAMS.txt') `
            -Encoding UTF8

      - name: Verify complete Bot package
        shell: pwsh
        run: |
          $required = @(
            'package\Bin\Bot.exe',
            'package\Bin\Bot.exe.config',
            'package\Bin\BotLib.dll',
            'package\Bin\DbEntity.dll',
            'package\Bin\FlaUI.Core.dll',
            'package\Bin\FlaUI.UIA3.dll',
            'package\Bin\local-ocr\LocalOcrWorker.exe',
            'package\Bin\local-ocr\models\v6\PP-OCRv6_det_small.onnx',
            'package\Bin\local-ocr\models\v6\PP-OCRv6_rec_small.onnx',
            'package\Bin\local-ocr\models\v6\ppocrv6_small_dict.txt',
            'package\data\README-PARAMS.txt'
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required package file not found: $path"
            }
          }

          if (Test-Path -LiteralPath 'package\data\params.db') {
            throw 'params.db must not be present in the GitHub artifact.'
          }

          Get-Item -LiteralPath 'package\Bin\Bot.exe' |
            Format-List FullName,Length,LastWriteTime

      - name: Upload complete x64 package
        uses: actions/upload-artifact@v4
        with:
          name: qianniu-bot-complete-x64-${{ github.sha }}
          path: package/**
          if-no-files-found: error
          retention-days: 14