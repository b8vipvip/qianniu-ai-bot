name: One-off OCR runtime diagnostic 1095

on:
  push:
    branches:
      - fix/runtime-1095-context-order-ocr
    paths:
      - .github/workflows/oneoff-ocr-diag-1095.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-1095-context-order-ocr
      - name: Show transitive worker packages
        shell: pwsh
        run: |
          dotnet restore tools/LocalOcrWorker/LocalOcrWorker.csproj -r win-x64
          dotnet list tools/LocalOcrWorker/LocalOcrWorker.csproj package --include-transitive
      - name: Publish and inspect native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ocr-diag'
          dotnet publish tools/LocalOcrWorker/LocalOcrWorker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o $out
          Write-Host '--- ONNX/native candidates ---'
          Get-ChildItem -LiteralPath $out -Recurse -File | Where-Object { $_.Name -match 'onnx|vcruntime|msvcp|api-ms-win-crt' } | Select-Object FullName,Length | Format-Table -AutoSize
          $onnx = Get-ChildItem -LiteralPath $out -Recurse -File -Filter onnxruntime.dll
          if (-not $onnx) { throw 'onnxruntime.dll missing from published worker' }
          Write-Host ('onnxruntime.dll=' + $onnx[0].FullName)
          Write-Host '--- worker top-level files ---'
          Get-ChildItem -LiteralPath $out -File | Select-Object Name,Length | Sort-Object Name | Format-Table -AutoSize
