name: Apply 1196 follow-up hardening

on:
  push:
    branches:
      - fix/composer-order-inbound-hardening-20260904
    paths:
      - .github/workflows/apply-runtime-hardening-20260904.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply asserted source migration
        run: python .github/scripts/apply_runtime_hardening_20260904.py
      - name: Commit source migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/QNRpa.cs src/Bot/ChromeNs/OrderTemplateRequiredFieldsV2.cs src/Bot/Options/LegacyAboutUpdateRedirect.cs tests/test_stale_composer_cleanup_and_log_retention_static.py tests/test_order_template_required_fields_v2_static.py tests/test_qianniu_duplicate_cdp_inbound_recovery_static.py tests/test_1196_followup_runtime_hardening_static.py
          git diff --cached --check
          git commit -m "fix: harden composer ownership order fields and inbound replay"
          git push
