name: Finalize manual AI optimization PR

# Trigger after this workflow already exists on the default branch.
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/fix-manual-ai-optimization-pr.yml' ]

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-ai-optimization-ingress-watchdog
          fetch-depth: 0
      - name: Apply final safety fixes
        shell: python
        run: |
          from pathlib import Path

          feature = Path('src/Bot/Knowledge/KnowledgeCenterWindow.cs')
          text = feature.read_text(encoding='utf-8-sig')
          if 'using Bot.Common;' not in text:
              text = text.replace('using Bot.ChatRecord;\n', 'using Bot.ChatRecord;\nusing Bot.Common;\n', 1)

          text = text.replace('                        "千牛注入状态:",\n', '')
          text = text.replace('                        "SendForGetText",\n', '')
          old = '                    var pattern = string.Join("|", phrases.Select(Regex.Escape));'
          new = '                    var pattern = string.Join("|", phrases.Select(Regex.Escape))\n                        + "|千牛注入状态:.*" + Regex.Escape("\\\"extra\\\":\\\"loop\\\"");'
          if old not in text:
              raise SystemExit('missing log pattern anchor')
          text = text.replace(old, new, 1)
          feature.write_text(text, encoding='utf-8')

          old_test = Path('tests/test_order_template_final_gate_v3_static.py')
          test_text = old_test.read_text(encoding='utf-8-sig')
          old_block = '''def test_final_renderer_keeps_present_fields_and_cleans_spacing():
              source = read(SERVICE)
              assert 'RenderTemplate(cfg.OrderPlacedReplyText, plan, "fixed-preset")' in source
              assert "partial=" in source
              assert "all_requested_fields_missing=" in source
              assert 'Regex.Replace(rendered, @"[ \\\\t]{2,}", " ")' in source
              assert 'Regex.Replace(rendered, @"([：:])\\\\s+", "$1")' in source
          '''
          new_block = '''def test_final_renderer_keeps_present_fields_and_preserves_authored_layout():
              source = read(SERVICE)
              assert 'RenderTemplate(cfg.OrderPlacedReplyText, plan, "fixed-preset")' in source
              assert "partial=" in source
              assert "all_requested_fields_missing=" in source
              assert 'Regex.Replace(rendered, @"[ \\\\t]{2,}", " ")' not in source
              assert 'Regex.Replace(rendered, @"([：:])\\\\s+", "$1")' not in source
              assert "保留商家编辑的换行、连续空格和缩进" in source
          '''
          if old_block not in test_text:
              raise SystemExit('missing legacy whitespace test block')
          old_test.write_text(test_text.replace(old_block, new_block, 1), encoding='utf-8')

          focused = Path('tests/test_manual_ai_optimization_ingress_watchdog_static.py')
          focused.write_text('''from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = (ROOT / "src/Bot/Knowledge/KnowledgeCenterWindow.cs").read_text(encoding="utf-8-sig")

          def test_manual_takeover_generates_compare_only_ai_and_history():
              assert 'Header = "AI优化记录"' in SOURCE
              assert '"人工接管后的AI优化对比"' in SOURCE
              assert 'desk.AddConversation(seller, buyer, question,' in SOURCE
              assert 'false, "人工接管后的AI优化对比"' in SOURCE
              assert 'accuracy_score' in SOURCE
              assert 'human_reply_reason' in SOURCE
              assert 'knowledge_strategy' in SOURCE
              assert 'ReviewedKnowledgeLearningService.ApplyReviewedKnowledge' in SOURCE

          def test_ingress_watchdog_recovers_active_history_and_order_panel():
              assert 'RuntimeIngressReconciliationBridge' in SOURCE
              assert 'ReconcileActiveConversationIngressAsync' in SOURCE
              assert 'im.singlemsg.GetRemoteHisMsg' in SOURCE
              assert 'runtimePassiveIngressWatchdog' in SOURCE
              assert 'TryRecoverVisibleOrderPanelForBackgroundProbeAsync' in SOURCE

          def test_log_noise_filter_keeps_high_signal_failures():
              filter_block = SOURCE.split('internal static class RuntimeLogNoiseFilterBootstrap', 1)[1]
              assert '设置界面已将“人工客服工作时间与下班回复”迁移' in filter_block
              assert '设置界面已在构造阶段将“启用转人工规则”' in filter_block
              assert '"UIA控件刷新成功:"' in filter_block
              assert '"SendForGetText"' not in filter_block
              assert '"千牛注入状态:",' not in filter_block
              assert 'Regex.Escape("\\\"extra\\\":\\\"loop\\\"")' in filter_block

          def test_common_ai_namespace_is_explicit():
              assert 'using Bot.Common;' in SOURCE
          ''', encoding='utf-8')
      - name: Run focused regression tests
        run: |
          python -m pytest -q tests/test_manual_ai_optimization_ingress_watchdog_static.py tests/test_order_template_final_gate_v3_static.py tests/test_order_reply_template_placeholders_v3_static.py
      - name: Commit feature branch fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Bot/Knowledge/KnowledgeCenterWindow.cs tests/test_order_template_final_gate_v3_static.py tests/test_manual_ai_optimization_ingress_watchdog_static.py
          git commit -m "fix: finalize manual AI optimization safety and log filtering"
          git push origin HEAD:agent/manual-ai-optimization-ingress-watchdog
