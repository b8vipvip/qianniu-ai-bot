name: Apply post-1.1.1245 runtime hotfix

on:
  push:
    branches:
      - fix/post-1245-runtime-hardening-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-1245-runtime-hardening-20260904
          fetch-depth: 0
      - name: Apply hotfix
        run: python tools/apply_post1245_hotfix.py
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden post-1.1.1245 runtime fallbacks"
          git push origin HEAD:fix/post-1245-runtime-hardening-20260904
