name: Patch update self heal v2

on:
  push:
    branches:
      - fix/update-self-heal-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-self-heal-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic patch
        run: python scripts/patch_update_self_heal_v2.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/Bot/Update/BotUpdateService.Actions.Fast.cs \
            src/Bot/Update/BotAutoUpdater.ps1 \
            src/Bot/Options/BotUpdateOptionsControl.cs \
            src/Bot/Update/BotUpdateService.ServerPush.Fast.cs \
            tests/test_bot_update_target_updater_self_heal_static.py
          git commit -m "fix: self-heal cross-version Bot updates"
          git push origin HEAD:fix/update-self-heal-v2
