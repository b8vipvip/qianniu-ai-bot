name: Dispatch manual AI optimization branch validation

on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/dispatch-manual-ai-optimization-branch.yml' ]

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-ai-optimization-ingress-watchdog
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/apply_manual_ai_optimization_ingress_watchdog.py
      - name: Run focused regression tests
        run: |
          python -m pytest -q tests/test_manual_ai_optimization_ingress_watchdog_static.py tests/test_order_reply_template_placeholders_v3_static.py
      - name: Commit branch result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          if git diff --cached --quiet; then
            echo "No branch changes"
          else
            git commit -m "feat: compare final AI answers after manual takeover and recover stale ingress"
            git push origin HEAD:agent/manual-ai-optimization-ingress-watchdog
          fi
