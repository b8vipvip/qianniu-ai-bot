name: One-shot knowledge authority and lifecycle repair

on:
  push:
    branches:
      - fix/knowledge-authority-stale-turn-runtime-20260905

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-authority-stale-turn-runtime-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply structural repair
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

