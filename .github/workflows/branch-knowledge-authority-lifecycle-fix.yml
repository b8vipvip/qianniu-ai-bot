    assert 'lease.MarkFailed("streaming_send_failed")' in pipeline
    assert 'lease.MarkCompleted("streaming_answer_generated_only")' in pipeline
    assert 'return MarkReady("send_barrier_stable");' in coordinator
''', encoding='utf-8')

