name: Apply order reply layout preserve

on:
  push:
    branches: [ agent/order-reply-layout-preserve ]
    paths: [ '.github/workflows/apply-order-reply-layout-preserve.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/order-reply-layout-preserve
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/apply_order_reply_layout_preserve.py
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_order_reply_template_placeholders_v3_static.py tests/test_late_order_panel_recovery_static.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/OrderPlacedAutoReplyService.cs tests/test_order_reply_template_placeholders_v3_static.py
          git diff --cached --check
          git commit -m "fix: preserve order preset message layout"
          git push origin HEAD:agent/order-reply-layout-preserve
