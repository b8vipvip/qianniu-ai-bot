name: Apply chat2api diagnostic fix

on:
  push:
    branches:
      - agent/chat2api-long-latency-diagnostic-chain

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat2api-long-latency-diagnostic-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted patch
        run: python tools/agent_apply_chat2api_diagnostic_fix.py
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            services/api-control-plane/chat2api_runtime_guard.py \
            services/api-control-plane/runtime_routing_guard.py \
            services/api-control-plane/tests/test_chat2api_runtime_guard.py \
            services/api-control-plane/tests/test_runtime_routing_guard.py
      - name: Run targeted routing tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          cd services/api-control-plane
          python -m pytest -q tests/test_chat2api_runtime_guard.py tests/test_runtime_routing_guard.py
      - name: Commit patch and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/agent_apply_chat2api_diagnostic_fix.py .github/workflows/agent-apply-chat2api-diagnostic-fix.yml
          git add \
            services/api-control-plane/chat2api_runtime_guard.py \
            services/api-control-plane/runtime_routing_guard.py \
            services/api-control-plane/.env.example \
            services/api-control-plane/tests/test_chat2api_runtime_guard.py \
            services/api-control-plane/tests/test_runtime_routing_guard.py \
            src/Bot/ShopScope/ShopApiDiagnosticsService.cs
          git commit -m "fix: tolerate slow chat2api diagnostic responses"
          git push origin HEAD:agent/chat2api-long-latency-diagnostic-chain
