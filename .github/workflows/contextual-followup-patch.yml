name: Contextual follow-up patch

on:
  push:
    branches:
      - fix/contextual-followup-coalescing-20260902
    paths:
      - tools/apply_contextual_followup_fix.py
      - .github/workflows/contextual-followup-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contextual-followup-coalescing-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply source patch
        run: python tools/apply_contextual_followup_fix.py
      - name: Normalize semantic regression contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          new_test = Path('tests/test_contextual_followup_coalescing_static.py')
          text = new_test.read_text(encoding='utf-8')
          old = "    assert '\"可以吗\"' in source and '\"能用吗\"' in source and '\"多少钱\"' in source\n"
          new = "    assert '可以|可以吗|可以不' in source\n    assert '能|能吗|能用|能用吗|能不能' in source\n    assert '多久|什么时候|多少钱|在哪|哪里' in source\n"
          if old not in text:
              raise SystemExit('semantic regex regression anchor missing')
          new_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          legacy_test = Path('tests/test_runtime_1095_context_order_ocr_static.py')
          text = legacy_test.read_text(encoding='utf-8-sig')
          if 'SemanticContinuationWindowSeconds = 15' not in text:
              raise SystemExit('legacy semantic TTL anchor missing')
          if '买家上一句与当前指代续问，请合并理解为一个完整问题' not in text:
              raise SystemExit('legacy semantic prompt anchor missing')
          text = text.replace('SemanticContinuationWindowSeconds = 15', 'SemanticContinuationWindowSeconds = 180', 1)
          text = text.replace('买家上一句与当前指代续问，请合并理解为一个完整问题', '买家当前消息是对上一条未解决问题的省略补充或催问', 1)
          legacy_test.write_text(text, encoding='utf-8')
          PY
      - name: Run focused regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_contextual_followup_coalescing_static.py \
            tests/test_humanlike_burst_static.py \
            tests/test_send_delivery_and_burst_regressions_static.py \
            tests/test_non_buyer_conversation_guard_static.py \
            tests/test_current_buyer_health_watchdog_static.py \
            tests/test_runtime_1095_context_order_ocr_static.py
      - name: Run full repository static regressions
        run: python -m pytest -q tests
      - name: Commit production patch and remove applier
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_contextual_followup_fix.py .github/workflows/contextual-followup-patch.yml
          git add src tests
          git commit -m 'fix: merge contextual follow-ups without coalescing starvation'
          git push origin HEAD:fix/contextual-followup-coalescing-20260902
