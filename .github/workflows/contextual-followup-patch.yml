name: Contextual follow-up patch

on:
  push:
    branches:
      - fix/contextual-followup-coalescing-20260902
    paths:
      - tools/apply_contextual_followup_fix.py
      - .github/workflows/contextual-followup-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contextual-followup-coalescing-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply source patch
        run: python tools/apply_contextual_followup_fix.py
      - name: Run focused regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_contextual_followup_coalescing_static.py \
            tests/test_humanlike_burst_static.py \
            tests/test_send_delivery_and_burst_regressions_static.py \
            tests/test_non_buyer_conversation_guard_static.py \
            tests/test_current_buyer_health_watchdog_static.py
      - name: Run full repository static regressions
        run: python -m pytest -q tests
      - name: Commit production patch and remove applier
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_contextual_followup_fix.py .github/workflows/contextual-followup-patch.yml
          git add src tests
          git commit -m 'fix: merge contextual follow-ups without coalescing starvation'
          git push origin HEAD:fix/contextual-followup-coalescing-20260902
