name: PR204 runtime fix applier

on:
  push:
    branches:
      - fix/embedding-order-platform-guard-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/embedding-order-platform-guard-20260902
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply guarded runtime patch
        run: |
          python scripts/dev/apply_pr204_runtime_fixes.py
          python scripts/dev/fix_pr204_generated_tests.py

      - name: Run focused regression tests
        run: >-
          python -m pytest -q
          tests/test_embedding_async_deadline_static.py
          tests/test_order_event_cross_process_state_static.py
          tests/test_order_preset_manual_segment_continuation_static.py
          tests/test_order_action_cross_process_ledger_static.py
          tests/test_qianniu_service_attitude_block_static.py

      - name: Commit patch and remove temporary applier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/dev/apply_pr204_runtime_fixes.py
          git rm scripts/dev/fix_pr204_generated_tests.py
          git rm .github/workflows/pr204-runtime-fix-applier.yml
          git add src tests
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: harden order action state and platform send guard"
          git push origin HEAD:fix/embedding-order-platform-guard-20260902
