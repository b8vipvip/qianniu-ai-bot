name: One-shot lifecycle repair

on:
  push:
    branches:
      - fix/knowledge-authority-stale-turn-runtime-20260905

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-authority-stale-turn-runtime-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply lifecycle ownership repair
        run: python .github/scripts/lifecycle_repair_20260905.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_1272_knowledge_authority_and_turn_lifecycle_static.py
      - name: Commit source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot tests/test_1272_knowledge_authority_and_turn_lifecycle_static.py
          git commit -m "fix: make session agent the single turn terminal owner"
          git push origin HEAD:fix/knowledge-authority-stale-turn-runtime-20260905
