name: Apply rule policy import export

on:
  push:
    branches:
      - feat/rule-policy-import-export
    paths:
      - .github/scripts/apply_rule_policy_import_export.py
      - .github/workflows/apply-rule-policy-import-export.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rule-policy-import-export
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/scripts/apply_rule_policy_import_export.py
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_rule_policy_import_export_static.py tests/test_smart_reply_router_store_prompt_static.py tests/test_smart_reply_engine_v2_phase3_static.py
      - name: Commit source changes
        run: |
          rm -f .github/scripts/apply_rule_policy_import_export.py
          rm -f .github/workflows/apply-rule-policy-import-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add import export for store rules and knowledge policies"
          git push origin HEAD:feat/rule-policy-import-export
