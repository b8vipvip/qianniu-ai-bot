name: Recharge upstream public probe

on:
  push:
    branches:
      - fix/recharge-query-public-endpoint
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public login contract without credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from html.parser import HTMLParser
          from http.cookiejar import CookieJar
          from urllib.parse import urlsplit

          class LoginParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = ''
                  self._in_title = False
                  self._in_script = False
                  self.script_chunks = []
                  self.inputs = []
                  self.buttons = []
                  self.forms = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'title': self._in_title = True
                  elif tag == 'script': self._in_script = True
                  elif tag == 'input':
                      self.inputs.append({k: attrs.get(k, '') for k in ('id','name','type','placeholder','autocomplete')})
                  elif tag == 'button':
                      self.buttons.append({k: attrs.get(k, '') for k in ('id','type','onclick')})
                  elif tag == 'form':
                      self.forms.append({k: attrs.get(k, '') for k in ('id','method','action')})
              def handle_endtag(self, tag):
                  if tag == 'title': self._in_title = False
                  elif tag == 'script': self._in_script = False
              def handle_data(self, data):
                  if self._in_title: self.title += data
                  if self._in_script: self.script_chunks.append(data)

          url = 'https://ka.k2n.cn/login.php'
          jar = CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          request = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
          with opener.open(request, timeout=30) as response:
              raw = response.read()
              text = raw.decode('utf-8', errors='replace')
          parser = LoginParser(); parser.feed(text)
          print('title=' + parser.title.strip())
          print('inputs=' + json.dumps(parser.inputs, ensure_ascii=False, sort_keys=True))
          print('buttons=' + json.dumps(parser.buttons, ensure_ascii=False, sort_keys=True))
          print('forms=' + json.dumps(parser.forms, ensure_ascii=False, sort_keys=True))
          script = '\n'.join(parser.script_chunks)
          interesting = []
          for line in script.splitlines():
              compact = re.sub(r'\s+', ' ', line).strip()
              if any(token in compact for token in ('fetch(', 'XMLHttpRequest', '$.ajax', 'login.php', 'location', 'session', 'key')):
                  interesting.append(compact[:500])
          print('script_hints=' + json.dumps(interesting[:30], ensure_ascii=False))
          print('body_sha256=' + hashlib.sha256(raw).hexdigest())
          PY
