name: Refine order partial diagnostics

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'fix/order-template-final-gate-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-template-final-gate-v3
          fetch-depth: 0

      - name: Apply refinement
        run: python .github/scripts/refine_order_partial_diagnostics.py

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused regressions
        run: python -m pytest -q tests/test_order_template_required_fields_v2_static.py tests/test_order_template_final_gate_v3_static.py

      - name: Commit refined source
        shell: bash
        run: |
          rm -f .github/scripts/refine_order_partial_diagnostics.py
          rm -f .github/workflows/refine-order-partial-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refine partial order field diagnostics"
          git push origin HEAD:fix/order-template-final-gate-v3
