name: One-time native send source patch

on:
  push:
    branches:
      - fix/cdp-native-send-integrity-20260817

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cdp-native-send-integrity-20260817
          fetch-depth: 0

      - name: Route text send through native-first pipeline
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Bot/ChromeNs/QNRpa.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = 'sendResult = await TrySendTextViaUiaAsync(buyer, text, sendStart).ConfigureAwait(false);'
          new = 'sendResult = await TrySendTextNativeFirstAsync(buyer, text, sendStart).ConfigureAwait(false);'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one send call, found {text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace(
              'method=UIA定位+发送主按钮坐标, failure=',
              'method=CDP页面按钮+HWND安全消息+UIA安全回退, failure=',
              1,
          )
          path.write_text(text, encoding='utf-8-sig')

          workflow = Path('.github/workflows/patch-native-send-source.yml')
          workflow.unlink()

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/QNRpa.cs .github/workflows/patch-native-send-source.yml
          git commit -m "fix: route text send through native-first pipeline"
          git push origin HEAD:fix/cdp-native-send-integrity-20260817
