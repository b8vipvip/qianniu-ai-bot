name: Apply post-1.1.1250 safe composer mutation fix

on:
  push:
    branches:
      - fix/post-1250-send-mutation-20260905
    paths:
      - .github/workflows/post-1250-safe-mutation-apply.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Patch QNRpa and add regression test
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/Bot/ChromeNs/QNRpa.cs")
          source = path.read_text(encoding="utf-8-sig")

          old_constants = '''        private const int CdpQuickProbeTimeoutMs = 900;
          private const int CdpActionTimeoutMs = 4500;
          private const int UiActionTimeoutMs = 1800;
'''
          new_constants = '''        private const int CdpQuickProbeTimeoutMs = 900;
          private const int CdpActionTimeoutMs = 4500;
          private const int UiActionTimeoutMs = 1800;
          private const int UiMutationTimeoutMs = 4500;
'''
          if source.count(old_constants) != 1:
              raise SystemExit("QNRpa constants anchor changed")
          source = source.replace(old_constants, new_constants, 1)

          old_fields = '''        private static readonly TimeSpan OwnedDraftRetention = TimeSpan.FromMinutes(30);

          private string _lastOwnedDraftBuyer = string.Empty;
'''
          new_fields = '''        private static readonly TimeSpan OwnedDraftRetention = TimeSpan.FromMinutes(30);

          // A timed-out UI mutation must never be followed by a second concurrent mutation. Keep
          // the original worker leased until it actually exits; retries fail fast meanwhile.
          private readonly object _uiMutationLock = new object();
          private Task<bool> _activeUiMutationTask;

          private string _lastOwnedDraftBuyer = string.Empty;
'''
          if source.count(old_fields) != 1:
              raise SystemExit("QNRpa mutation field anchor changed")
          source = source.replace(old_fields, new_fields, 1)

          old_method = '''        private async Task<bool> RunUiMutationAsync(Func<bool> action, string stage)
          {
              if (action == null) return false;
              try
              {
                  // Side-effecting UI work must never be abandoned after a timeout. A timed-out
                  // Task.Run can still press Ctrl+A/Backspace later and erase a newer draft.
                  return await Task.Run(action).ConfigureAwait(false);
              }
              catch (Exception ex)
              {
                  SetSendFailure(stage, ex.Message);
                  Log.Info(stage + "失败: " + ex.Message);
                  return false;
              }
          }
'''
          new_method = '''        private async Task<bool> RunUiMutationAsync(Func<bool> action, string stage)
          {
              if (action == null) return false;

              Task<bool> worker;
              lock (_uiMutationLock)
              {
                  if (_activeUiMutationTask != null && !_activeUiMutationTask.IsCompleted)
                  {
                      SetSendFailure(stage, "上一条UI草稿修改仍在安全退出，禁止并发启动新的草稿修改");
                      Log.Info(stage + "已快速失败：上一条UI草稿修改仍在后台退出，避免两个任务并发清空/覆盖输入框。seller="
                          + SellerNick);
                      return false;
                  }

                  try
                  {
                      worker = Task.Run(action);
                      _activeUiMutationTask = worker;
                  }
                  catch (Exception ex)
                  {
                      SetSendFailure(stage, ex.Message);
                      return false;
                  }
              }

              var winner = await Task.WhenAny(
                  worker,
                  Task.Delay(UiMutationTimeoutMs)).ConfigureAwait(false);
              if (winner != worker)
              {
                  // Do not cancel/abort a side-effecting worker: COM/UIA is not cooperatively
                  // cancellable. Keep its lease until completion so retries cannot race it. Every
                  // destructive draft-cleanup action revalidates the exact owned text immediately
                  // before Ctrl+A/Backspace, so a late worker cannot erase a newer/manual draft.
                  SetSendFailure(stage, "UI草稿修改超过" + UiMutationTimeoutMs
                      + "ms，已停止等待；原任务保持独占租约直到安全退出");
                  Log.Info(stage + "等待超时，发送链路已释放等待但保留单一UI修改租约: seller="
                      + SellerNick + ", timeoutMs=" + UiMutationTimeoutMs);
                  worker.ContinueWith(completed =>
                  {
                      lock (_uiMutationLock)
                      {
                          if (ReferenceEquals(_activeUiMutationTask, worker))
                          {
                              _activeUiMutationTask = null;
                          }
                      }
                      Log.Info(stage + "超时后的UI草稿修改任务已退出，可接受后续草稿任务: seller=" + SellerNick);
                  }, TaskScheduler.Default);
                  return false;
              }

              try
              {
                  return await worker.ConfigureAwait(false);
              }
              catch (Exception ex)
              {
                  SetSendFailure(stage, ex.Message);
                  Log.Info(stage + "失败: " + ex.Message);
                  return false;
              }
              finally
              {
                  lock (_uiMutationLock)
                  {
                      if (ReferenceEquals(_activeUiMutationTask, worker))
                      {
                          _activeUiMutationTask = null;
                      }
                  }
              }
          }
'''
          if source.count(old_method) != 1:
              raise SystemExit("RunUiMutationAsync anchor changed")
          source = source.replace(old_method, new_method, 1)

          old_cleanup = '''                    if (!TryGetEditorText(out latestText)
                          || !EditorMatchesExpectedText(latestText, ownedText)
                          || !IsOwnedDraftForBuyer(buyer, latestText)
                          || !FocusEditor())
                      {
                          return false;
                      }
                      PressCtrlA();
                      PressBackspace();
'''
          new_cleanup = '''                    if (!TryGetEditorText(out latestText)
                          || !EditorMatchesExpectedText(latestText, ownedText)
                          || !IsOwnedDraftForBuyer(buyer, latestText)
                          || !FocusEditor())
                      {
                          return false;
                      }

                      // FocusEditor can spend time inside the WPF/UIA bridge. Re-read the live
                      // editor after focus and immediately before the destructive key sequence. If
                      // a human/new Bot task changed the draft while focus was delayed, fail closed.
                      string postFocusText;
                      if (!TryGetEditorText(out postFocusText)
                          || !EditorMatchesExpectedText(postFocusText, ownedText)
                          || !IsOwnedDraftForBuyer(buyer, postFocusText))
                      {
                          Log.Info("Bot历史残留草稿清理在聚焦后检测到内容已变化，已取消清空: buyer=" + buyer);
                          return false;
                      }
                      PressCtrlA();
                      PressBackspace();
'''
          if source.count(old_cleanup) != 1:
              raise SystemExit("residual cleanup anchor changed")
          source = source.replace(old_cleanup, new_cleanup, 1)

          path.write_text(source, encoding="utf-8")

          test = Path("tests/test_post_1250_send_mutation_static.py")
          test.write_text('''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nQNRPA = ROOT / "src" / "Bot" / "ChromeNs" / "QNRpa.cs"\n\n\ndef _source() -> str:\n    return QNRPA.read_text(encoding="utf-8-sig")\n\n\ndef test_side_effecting_ui_mutation_has_bounded_wait_and_single_active_lease():\n    source = _source()\n    assert "private const int UiMutationTimeoutMs = 4500;" in source\n    assert "private readonly object _uiMutationLock = new object();" in source\n    assert "private Task<bool> _activeUiMutationTask;" in source\n    method = source[source.index("private async Task<bool> RunUiMutationAsync"):source.index("private async Task<bool> HasExpectedDraftFastAsync")]\n    assert "Task.WhenAny(" in method\n    assert "Task.Delay(UiMutationTimeoutMs)" in method\n    assert "_activeUiMutationTask != null && !_activeUiMutationTask.IsCompleted" in method\n    assert "禁止并发启动新的草稿修改" in method\n    assert "ReferenceEquals(_activeUiMutationTask, worker)" in method\n    assert "Thread.Abort" not in method\n    assert "worker.Wait(" not in method\n\n\ndef test_late_residual_draft_worker_revalidates_exact_owned_text_after_focus():\n    source = _source()\n    start = source.index("检测到同一买家的Bot历史残留草稿，准备安全清空")\n    end = source.index("同一买家的Bot历史残留草稿已清空并二次确认为空", start)\n    block = source[start:end]\n    focus = block.index("!FocusEditor()")\n    post_focus = block.index("string postFocusText;", focus)\n    destructive = block.index("PressCtrlA();", post_focus)\n    assert focus < post_focus < destructive\n    between = block[post_focus:destructive]\n    assert "TryGetEditorText(out postFocusText)" in between\n    assert "EditorMatchesExpectedText(postFocusText, ownedText)" in between\n    assert "IsOwnedDraftForBuyer(buyer, postFocusText)" in between\n    assert "聚焦后检测到内容已变化，已取消清空" in between\n''', encoding="utf-8")

          workflow = Path(".github/workflows/post-1250-safe-mutation-apply.yml")
          workflow.unlink()
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP\patch.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\patch.py"
          python -m pytest -q tests/test_post_1250_send_mutation_static.py

      - name: Commit patched source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/QNRpa.cs tests/test_post_1250_send_mutation_static.py .github/workflows/post-1250-safe-mutation-apply.yml
          git commit -m "fix: bound residual composer mutation waits"
          git push origin HEAD:fix/post-1250-send-mutation-20260905
