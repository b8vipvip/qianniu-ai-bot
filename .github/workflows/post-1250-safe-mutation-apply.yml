name: Apply post-1.1.1250 safe composer mutation fix

on:
  push:
    branches:
      - fix/post-1250-send-mutation-20260905
    paths:
      - .github/workflows/post-1250-safe-mutation-apply.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply guarded source patch
        run: python tools/apply_post_1250_send_mutation_fix.py
      - name: Run focused regression test
        run: python -m pytest -q tests/test_post_1250_send_mutation_static.py
      - name: Commit patched source and remove one-shot helpers
        shell: pwsh
        run: |
          Remove-Item -LiteralPath tools/apply_post_1250_send_mutation_fix.py
          Remove-Item -LiteralPath .github/workflows/post-1250-safe-mutation-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound residual composer mutation waits"
          git push origin HEAD:fix/post-1250-send-mutation-20260905
