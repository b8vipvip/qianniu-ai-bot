name: Bootstrap one-shot repair workflow

on:
  push:
    branches:
      - fix/knowledge-authority-stale-turn-runtime-20260905

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-authority-stale-turn-runtime-20260905
          fetch-depth: 0
      - name: Repair maintenance workflow invocation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/branch-knowledge-authority-lifecycle-fix.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", "")
          text = text.replace('        shell: python\n', '        shell: python {0}\n')
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/branch-repair-bootstrap.yml').unlink()
          PY
      - name: Commit bootstrap correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: activate one-shot structural repair [skip ci]"
          git push origin HEAD:fix/knowledge-authority-stale-turn-runtime-20260905
