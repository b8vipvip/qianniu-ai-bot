name: One-shot generation send static test alignment

on:
  push:
    branches:
      - fix/stale-generation-send-cancellation-20260905

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Align legacy static tests
        run: python .github/scripts/align_generation_send_static_tests_20260905.py
      - name: Run full repository static tests
        run: python -m pytest -q tests
      - name: Commit aligned tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_bot_echo_markerless_delivery_static.py tests/test_bot_message_suffix_static.py tests/test_first_inquiry_streaming_guard_static.py tests/test_order_auto_reply_delay_static.py tests/test_order_reply_template_placeholders_v3_static.py tests/test_recent_visual_context_and_ai_concurrency_static.py tests/test_reply_transcript_prefix_sanitizer_static.py tests/test_server_push_watchdog_immediate_rules_static.py
          if git diff --cached --quiet; then
            echo 'No test changes to commit.'
            exit 0
          fi
          git commit -m 'test: align reliable-send assertions with generation cancellation [skip ci]'
          git push origin HEAD:fix/stale-generation-send-cancellation-20260905
