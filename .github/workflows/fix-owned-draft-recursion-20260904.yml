name: Fix owned draft recursion

on:
  push:
    branches:
      - fix/composer-order-inbound-hardening-20260904
    paths:
      - .github/workflows/fix-owned-draft-recursion-20260904.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_owned_draft_recursion_20260904.py
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/QNRpa.cs tests/test_1196_followup_runtime_hardening_static.py
          git diff --cached --check
          git commit -m "fix: clear owned draft state without recursion"
          git push
