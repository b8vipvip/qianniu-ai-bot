name: One-off runtime send 1088 fix

on:
  push:
    branches:
      - fix/runtime-send-failure-1088
    paths:
      - .github/workflows/oneoff-runtime-send-1088-fix.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-send-failure-1088
      - name: Install focused tests
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run runtime send regressions
        run: python -m pytest -q tests/test_runtime_send_failure_1088_static.py tests/test_native_first_text_send_static.py tests/test_seller_hwnd_uia_send_static.py tests/test_runtime_reply_failure_state_static.py tests/test_order_event_attention_static.py tests/test_qianniu_duplicate_cdp_inbound_recovery_static.py
