name: One-off runtime send 1088 fix

on:
  push:
    branches:
      - fix/runtime-send-failure-1088
    paths:
      - .github/workflows/oneoff-runtime-send-1088-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-send-failure-1088
          fetch-depth: 0
      - name: Apply runtime send state session fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8-sig")
          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit("missing patch anchor: " + label)
              return text.replace(old, new, 1)

          qnrpa_path = "src/Bot/ChromeNs/QNRpa.cs"
          qnrpa = read(qnrpa_path)
          anchor = '        private bool TryInvokeCachedSendButtonNow()\n        {\n            if (_sendMessageButton == null || uia3Automation == null) return false;\n            try\n            {\n'
          replacement = '''        private bool TryInvokeExactVerifiedSendButtonNow()
          {
              if (_sendMessageButton == null) return false;
              try
              {
                  var automationId = _sendMessageButton.AutomationId ?? string.Empty;
                  var name = _sendMessageButton.Name ?? string.Empty;
                  if (!string.Equals(automationId, SendButtonAutomationId, StringComparison.Ordinal)
                      || !IsSendButtonName(name))
                  {
                      Log.Info("精确发送按钮UIA调用已阻止：控件身份不匹配");
                      return false;
                  }
                  var identity = (automationId + " " + name).ToLowerInvariant();
                  if (identity.Contains("arrow") || identity.Contains("dropdown")
                      || identity.Contains("menu") || identity.Contains("downbutton")
                      || identity.Contains("下拉") || identity.Contains("展开"))
                  {
                      Log.Info("精确发送按钮UIA调用已阻止：命中下拉身份");
                      return false;
                  }
                  _sendMessageButton.AsButton().Invoke();
                  Log.Info("已通过精确发送按钮UIA Invoke执行发送: seller=" + SellerNick
                      + ", automationId=" + automationId + ", name=" + name
                      + ", rect=" + FormatRect(SafeBoundingRectangle(_sendMessageButton)));
                  return true;
              }
              catch (Exception ex)
              {
                  Log.Info("精确发送按钮UIA Invoke失败: " + ex.Message
                      + ", type=" + ex.GetType().FullName
                      + ", hresult=0x" + ex.HResult.ToString("X8"));
                  return false;
              }
          }

          private bool TryInvokeCachedSendButtonNow()
          {
              if (_sendMessageButton == null || uia3Automation == null) return false;
              try
              {
                  if (TryInvokeExactVerifiedSendButtonNow()) return true;
'''
          qnrpa = replace_once(qnrpa, anchor, replacement, "exact UIA send invoke")

          owned_anchor = '        private bool HasOwnedRecentDraft(string text)\n        {\n            text = (text ?? string.Empty).Trim();\n            return text.Length > 0\n                && string.Equals((LastSetPlainText ?? string.Empty).Trim(), text, StringComparison.Ordinal)\n                && LatestSetTextTime != DateTime.MinValue\n                && (DateTime.Now - LatestSetTextTime).TotalSeconds <= 20;\n        }\n'
          owned_addition = '''        private bool HasOwnedRecentDraft(string text)
          {
              text = (text ?? string.Empty).Trim();
              return text.Length > 0
                  && string.Equals((LastSetPlainText ?? string.Empty).Trim(), text, StringComparison.Ordinal)
                  && LatestSetTextTime != DateTime.MinValue
                  && (DateTime.Now - LatestSetTextTime).TotalSeconds <= 20;
          }

          internal bool IsKnownBotOwnedDraftText(string currentText)
          {
              var expected = (LastSetPlainText ?? string.Empty).Trim();
              return expected.Length > 0 && EditorMatchesExpectedText(currentText, expected);
          }

          internal async Task<bool> IsKnownBotOwnedDraftAsync()
          {
              if (string.IsNullOrWhiteSpace(LastSetPlainText)) return false;
              if (_messageInputTextArea == null)
              {
                  await RefreshChatControlsAsync(false).ConfigureAwait(false);
              }
              string current;
              return TryGetEditorText(out current) && IsKnownBotOwnedDraftText(current);
          }
'''
          qnrpa = replace_once(qnrpa, owned_anchor, owned_addition, "bot draft ownership")
          write(qnrpa_path, qnrpa)

          queue_path = "src/Bot/ChromeNs/NewOrderAttentionQueue.cs"
          queue = read(queue_path)
          old = '            if (!input.Empty)\n            {\n                BotActivityCoordinator.MarkHumanInteraction(snapshot.Seller, "客服输入框中存在未发送内容");\n                return Denied("客服正在输入消息");\n            }\n'
          new = '''            if (!input.Empty)
          {
              if (rpa != null && await rpa.IsKnownBotOwnedDraftAsync().ConfigureAwait(false))
              {
                  return Denied("Bot发送失败草稿仍在输入框，等待发送恢复且不计为人工操作");
              }
              BotActivityCoordinator.MarkHumanInteraction(snapshot.Seller, "客服输入框中存在未发送内容");
              return Denied("客服正在输入消息");
          }
'''
          queue = replace_once(queue, old, new, "order queue owned draft guard")
          old2 = '                    if (!input.Success || !input.Empty)\n                    {\n                        if (input.Success && !input.Empty)\n                        {\n                            BotActivityCoordinator.MarkHumanInteraction(snapshot.Seller, "自动切换前检测到客服输入内容");\n                        }\n                        return false;\n                    }\n'
          new2 = '''                    if (!input.Success || !input.Empty)
          {
              if (input.Success && !input.Empty)
              {
                  if (rpa != null && await rpa.IsKnownBotOwnedDraftAsync().ConfigureAwait(false))
                  {
                      Log.Info("自动切换前发现Bot自有失败草稿，未标记人工操作");
                  }
                  else
                  {
                      BotActivityCoordinator.MarkHumanInteraction(snapshot.Seller, "自动切换前检测到客服输入内容");
                  }
              }
              return false;
          }
'''
          queue = replace_once(queue, old2, new2, "focus owned draft guard")
          write(queue_path, queue)

          burst_path = "src/Bot/ChromeNs/BuyerMessageBurstCoordinator.cs"
          burst = read(burst_path)
          old = '                if (deterministicResult.Consumed)\n                {\n                    if (deterministicResult.Sent)\n                    {\n                        lease.MarkReplyDelivered(deterministicResult.Source);\n                    }\n                    lease.MarkCompleted("deterministic_rule_consumed");\n                    return;\n                }\n'
          new = '''                if (deterministicResult.Consumed)
          {
              if (deterministicResult.Sent)
              {
                  lease.MarkReplyDelivered(deterministicResult.Source);
                  lease.MarkCompleted("deterministic_rule_consumed");
              }
              else
              {
                  var deterministicSnapshot = _sessionAgent.GetSnapshot(state.Seller, state.Buyer);
                  if (deterministicSnapshot == null || deterministicSnapshot.State != BuyerSessionState.Failed)
                  {
                      lease.MarkFailed("deterministic_rule_send_failed");
                  }
              }
              return;
          }
'''
          burst = replace_once(burst, old, new, "deterministic failure terminal")
          old = '                if (afterDispatch != null && afterDispatch.State == BuyerSessionState.Generating)\n                {\n                    if (HasReplyableMessage(merged))\n                    {\n                        lease.MarkFailed("reply_pipeline_returned_without_ready");\n                    }\n                    else\n                    {\n                        lease.MarkCompleted("reply_pipeline_skipped");\n                    }\n                }\n                else\n                {\n                    lease.MarkCompleted("reply_pipeline_completed");\n                }\n'
          new = '''                if (afterDispatch != null && afterDispatch.State == BuyerSessionState.Failed)
          {
              Log.Info("买家回复管线返回时会话已失败，保留Failed终态且禁止升级Completed");
          }
          else if (afterDispatch != null && afterDispatch.State == BuyerSessionState.Generating)
          {
              if (HasReplyableMessage(merged)) lease.MarkFailed("reply_pipeline_returned_without_ready");
              else lease.MarkCompleted("reply_pipeline_skipped");
          }
          else
          {
              lease.MarkCompleted("reply_pipeline_completed");
          }
'''
          burst = replace_once(burst, old, new, "pipeline failed terminal")
          write(burst_path, burst)

          server_path = "src/Bot/ChromeNs/MyWebSocketServer.cs"
          server = read(server_path)
          marker = '        internal static bool TryGetAuthoritativeSession(string sellerNick, out string sessionId)\n'
          if marker not in server:
              raise SystemExit("missing authoritative-session helper anchor")
          auth_method = '''        internal static bool IsAuthoritativeSellerSession(string sellerNick, string sessionId)
          {
              sellerNick = NormalizeSeller(sellerNick);
              sessionId = (sessionId ?? string.Empty).Trim();
              if (sellerNick.Length == 0 || sessionId.Length == 0) return false;
              string authoritative;
              return _sellerSessions.TryGetValue(sellerNick, out authoritative)
                  && string.Equals(authoritative, sessionId, StringComparison.Ordinal);
          }

'''
          server = server.replace(marker, auth_method + marker, 1)
          write(server_path, server)

          cdp_path = "src/Bot/ChromeNs/CDPClient.cs"
          cdp = read(cdp_path)
          old = '            PreferRuntimeSession(sellerNick, SessionId, buyerNick, "onConversationChange");\n'
          new = '''            if (MyWebSocketServer.IsAuthoritativeSellerSession(sellerNick, SessionId))
          {
              PreferRuntimeSession(sellerNick, SessionId, buyerNick, "onConversationChange");
          }
          else
          {
              Log.Info("重复千牛页面会话切换仅作为入站证据，不接管CDP命令路由");
          }
'''
          cdp = replace_once(cdp, old, new, "duplicate session route guard")
          write(cdp_path, cdp)
          PY
      - name: Install focused tests
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run existing focused regressions
        run: python -m pytest -q tests/test_native_first_text_send_static.py tests/test_seller_hwnd_uia_send_static.py tests/test_runtime_reply_failure_state_static.py tests/test_order_event_attention_static.py tests/test_qianniu_duplicate_cdp_inbound_recovery_static.py
      - name: Verify new guards
        run: |
          grep -q 'TryInvokeExactVerifiedSendButtonNow' src/Bot/ChromeNs/QNRpa.cs
          grep -q 'IsKnownBotOwnedDraftAsync' src/Bot/ChromeNs/NewOrderAttentionQueue.cs
          grep -q 'deterministic_rule_send_failed' src/Bot/ChromeNs/BuyerMessageBurstCoordinator.cs
          grep -q 'IsAuthoritativeSellerSession' src/Bot/ChromeNs/CDPClient.cs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/QNRpa.cs src/Bot/ChromeNs/NewOrderAttentionQueue.cs src/Bot/ChromeNs/BuyerMessageBurstCoordinator.cs src/Bot/ChromeNs/MyWebSocketServer.cs src/Bot/ChromeNs/CDPClient.cs
          git diff --cached --check
          git commit -m "fix: harden runtime send failure recovery"
          git push origin HEAD:fix/runtime-send-failure-1088
