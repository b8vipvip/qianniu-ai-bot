name: Agent apply send AccessDenied fix

on:
  push:
    branches:
      - fix/send-access-denied-auto-replies-20260815

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-send-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/send-access-denied-auto-replies-20260815
          fetch-depth: 0

      - name: Apply guarded send fallback patch
        run: python .github/scripts/patch_send_access_denied.py

      - name: Commit patched source and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/QNRpa.cs tests/test_first_inquiry_fixed_reply_static.py docs/IMSDK_DIRECT_SEND_DISCOVERY.md
          git commit -m "fix(qianniu): fallback to UIA when coordinate send is denied [agent-send-fix-applied]"
          git push origin HEAD:fix/send-access-denied-auto-replies-20260815
