name: Patch rescue updater and runtime websocket

on:
  push:
    branches: ["fix/rescue-update-runtime-ws-20260819"]
    paths: [".github/workflows/patch-rescue-runtime-ws-20260819.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rescue-update-runtime-ws-20260819
          fetch-depth: 0

      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8-sig")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          marker_old = "20260714-zh-cn-v9"
          marker_new = "20260819-runtime-ws-v10"
          replace_exact("src/Bot/Common/QNInject.cs", marker_old, marker_new)
          replace_exact("src/Bin/inject.js", marker_old, marker_new)

          replace_exact(
              "src/Bin/inject.js",
              '  function socketOpen() { return window.chatWebsocket && window.chatWebsocket.readyState === WebSocket.OPEN; }\n',
              '''  function qnbotSocket() {\n    try {\n      var socket = window.__qnbotWebSocket;\n      return socket && socket.__qnbotOwned ? socket : null;\n    } catch (e) { return null; }\n  }\n\n  function socketOpen() {\n    var socket = qnbotSocket();\n    return !!(socket && socket.readyState === WebSocket.OPEN);\n  }\n''')

          replace_exact(
              "src/Bin/inject.js",
              '      try { window.chatWebsocket.send(payload); return; } catch (e) { warn("send failed", e); }\n',
              '      try { qnbotSocket().send(payload); return; } catch (e) { warn("send failed", e); }\n')

          replace_exact(
              "src/Bin/inject.js",
              '''  function flushPending() {\n    if (!socketOpen()) return;\n    while (pending.length > 0) {\n      try { window.chatWebsocket.send(pending.shift()); } catch (e) { break; }\n    }\n  }\n''',
              '''  function flushPending() {\n    var socket = qnbotSocket();\n    if (!socket || socket.readyState !== WebSocket.OPEN) return;\n    while (pending.length > 0) {\n      try { socket.send(pending.shift()); } catch (e) { break; }\n    }\n  }\n''')

          replace_exact(
              "src/Bin/inject.js",
              '''  function setupWebSocket() {\n    var old = window.chatWebsocket;\n    if (old && (old.readyState === WebSocket.OPEN || old.readyState === WebSocket.CONNECTING)) return;\n    try {\n      var socket = new WebSocket(WS_URL);\n      socket.onopen = function () {\n        window.chatWebsocket = socket;\n''',
              '''  function setupWebSocket() {\n    var old = qnbotSocket();\n    if (old && (old.readyState === WebSocket.OPEN || old.readyState === WebSocket.CONNECTING)) return;\n    try {\n      var socket = new WebSocket(WS_URL);\n      socket.__qnbotOwned = true;\n      window.__qnbotWebSocket = socket;\n      socket.onopen = function () {\n        window.__qnbotWebSocket = socket;\n''')

          replace_exact(
              "src/Bin/inject.js",
              '        if (window.chatWebsocket === socket) window.chatWebsocket = null;\n',
              '        if (window.__qnbotWebSocket === socket) window.__qnbotWebSocket = null;\n')

          replace_exact(
              "src/Bot/StartUp/BootStrap.cs",
              '''            MyWebSocketServer.WSocketSvrInst.Start();\n            QNInject.StartInject();\n            WeComAppBridgeClient.Start();\n''',
              '''            MyWebSocketServer.WSocketSvrInst.Start();\n            await QNInject.StartInject();\n            QnStartupConnectionSelfHeal.Start();\n            WeComAppBridgeClient.Start();\n''')

          replace_exact(
              "src/Directory.Build.targets",
              '''  <ItemGroup Condition="Exists('$(MSBuildProjectDirectory)\\Options\\CtlDataManagement.cs')">\n    <Compile Include="$(MSBuildProjectDirectory)\\Options\\CtlDataManagement.cs" />\n  </ItemGroup>\n</Project>''',
              '''  <ItemGroup Condition="Exists('$(MSBuildProjectDirectory)\\Options\\CtlDataManagement.cs')">\n    <Compile Include="$(MSBuildProjectDirectory)\\Options\\CtlDataManagement.cs" />\n  </ItemGroup>\n  <ItemGroup Condition="Exists('$(MSBuildProjectDirectory)\\ChromeNs\\QnStartupConnectionSelfHeal.cs')">\n    <Compile Include="$(MSBuildProjectDirectory)\\ChromeNs\\QnStartupConnectionSelfHeal.cs" />\n  </ItemGroup>\n</Project>''')

          workflow = Path(".github/workflows/publish-bot-auto-update-release.yml")
          text = workflow.read_text(encoding="utf-8-sig")
          anchor = '''          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"\n          echo "package_size=$package_size" >> "$GITHUB_OUTPUT"\n          echo "Prepared $TAG package: $package_size bytes, sha256=$sha256"\n'''
          replacement = '''          cp scripts/qianniu-bot-rescue-update.ps1 qianniu-bot-rescue-update.ps1\n          RESCUE_VERSION="$VERSION" RESCUE_URL="$download_url" RESCUE_SHA="$sha256" python3 -c 'import os; from pathlib import Path; p=Path("qianniu-bot-rescue-update.ps1"); s=p.read_text(encoding="utf-8-sig"); s=s.replace("__QIANNIU_TARGET_VERSION__", os.environ["RESCUE_VERSION"]).replace("__QIANNIU_PACKAGE_URL__", os.environ["RESCUE_URL"]).replace("__QIANNIU_SHA256__", os.environ["RESCUE_SHA"]); p.write_text(s, encoding="utf-8")'\n          grep -Fq "$VERSION" qianniu-bot-rescue-update.ps1\n          grep -Fq "$sha256" qianniu-bot-rescue-update.ps1\n\n          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"\n          echo "package_size=$package_size" >> "$GITHUB_OUTPUT"\n          echo "Prepared $TAG package: $package_size bytes, sha256=$sha256"\n'''
          if text.count(anchor) != 1:
              raise SystemExit("publish workflow package anchor changed")
          text = text.replace(anchor, replacement)

          create_anchor = '''          gh release create "$TAG" \\\n            qianniu-bot-x64.zip \\\n            update.json \\\n            --repo "$GITHUB_REPOSITORY" \\\n'''
          create_replacement = '''          gh release create "$TAG" \\\n            qianniu-bot-x64.zip \\\n            update.json \\\n            qianniu-bot-rescue-update.ps1 \\\n            --repo "$GITHUB_REPOSITORY" \\\n'''
          if text.count(create_anchor) != 1:
              raise SystemExit("publish workflow release-create anchor changed")
          text = text.replace(create_anchor, create_replacement)

          verify_anchor = '''          grep -Fx 'qianniu-bot-x64.zip' <<<"$assets"\n          grep -Fx 'update.json' <<<"$assets"\n'''
          verify_replacement = '''          grep -Fx 'qianniu-bot-x64.zip' <<<"$assets"\n          grep -Fx 'update.json' <<<"$assets"\n          grep -Fx 'qianniu-bot-rescue-update.ps1' <<<"$assets"\n'''
          if text.count(verify_anchor) != 1:
              raise SystemExit("publish workflow asset verification anchor changed")
          text = text.replace(verify_anchor, verify_replacement)
          workflow.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/patch-rescue-runtime-ws-20260819.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: add rescue updater and repair runtime websocket startup"
          git push origin HEAD:fix/rescue-update-runtime-ws-20260819
