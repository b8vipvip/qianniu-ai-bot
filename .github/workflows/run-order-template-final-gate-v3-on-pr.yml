name: Run order template final gate v3 on PR

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/order-template-final-gate-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-template-final-gate-v3
          fetch-depth: 0

      - name: Apply verified source patch
        run: python .github/scripts/apply_order_template_final_gate_v3.py

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_order_template_required_fields_v2_static.py tests/test_order_template_final_gate_v3_static.py

      - name: Commit patch to PR branch
        shell: bash
        run: |
          rm -f .github/scripts/apply_order_template_final_gate_v3.py
          rm -f .github/workflows/apply-order-template-final-gate-v3.yml
          rm -f .github/workflows/run-order-template-final-gate-v3-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve available order fields and log missing causes"
          git push origin HEAD:fix/order-template-final-gate-v3
