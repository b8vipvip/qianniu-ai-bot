name: Run order template final gate v3 on PR

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/order-template-final-gate-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-template-final-gate-v3
          fetch-depth: 0

      - name: Execute embedded patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/apply-order-template-final-gate-v3.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Patch unified order pipeline\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Run focused regression tests\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          code = '\n'.join(lines) + '\n'
          compile(code, '<embedded-order-template-patch>', 'exec')
          exec(code, {'__name__': '__main__'})

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_order_template_required_fields_v2_static.py tests/test_order_template_final_gate_v3_static.py

      - name: Commit patch to PR branch
        shell: bash
        run: |
          rm -f .github/workflows/apply-order-template-final-gate-v3.yml
          rm -f .github/workflows/run-order-template-final-gate-v3-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/DirectOrderEventBridge.cs \
                  src/Bot/ChromeNs/OrderTemplateRequiredFieldsV2.cs \
                  src/Bot/ChromeNs/OrderPlacedAutoReplyService.cs \
                  tests/test_order_template_final_gate_v3_static.py \
                  .github/workflows/apply-order-template-final-gate-v3.yml \
                  .github/workflows/run-order-template-final-gate-v3-on-pr.yml
          git commit -m "fix: route sparse order plans through required-field gate"
          git push origin HEAD:fix/order-template-final-gate-v3
