name: PR static diagnostics

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run repository static tests with captured output
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-static-pytest-log
          path: pytest.log
          if-no-files-found: warn
          retention-days: 2
