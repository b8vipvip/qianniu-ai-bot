<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>千牛 AI Bot</title>
  <link rel="stylesheet" href="/static/bot-web.css">
</head>
<body>
<div id="loginView" class="login-shell hidden">
  <form id="loginForm" class="login-card">
    <div class="brand">Q</div>
    <h1>千牛 AI Bot</h1>
    <p>使用 Windows Bot 的客户端令牌登录。令牌只用于识别并控制对应的 Bot，不使用管理员账号。</p>
    <label>Bot 客户端令牌
      <input id="tokenInput" type="password" autocomplete="current-password" placeholder="qnb_..." required>
    </label>
    <label class="remember"><input id="rememberToken" type="checkbox">在本设备记住令牌</label>
    <button class="primary wide" type="submit">登录 Bot</button>
    <div id="loginError" class="error"></div>
  </form>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div>
      <strong id="clientName">Bot</strong>
      <span id="connectionText" class="sub">正在连接</span>
    </div>
    <div class="top-actions">
      <span id="onlineBadge" class="pill gray">离线</span>
      <button id="logoutBtn" class="icon-button" aria-label="退出">退出</button>
    </div>
  </header>

  <main>
    <section id="page-status" class="page active">
      <div class="hero-card">
        <div>
          <span class="eyebrow">实时运行状态</span>
          <h2 id="heroStatus">等待 Windows Bot 上线</h2>
          <p id="heroDetail">新版客户端每隔几秒同步一次状态。</p>
        </div>
        <div id="heroDot" class="hero-dot"></div>
      </div>
      <div id="metrics" class="metric-grid"></div>
      <section class="panel">
        <div class="panel-head"><h3>登录中的客服账号</h3><span id="sellerCount" class="pill gray">0</span></div>
        <div id="sellerList" class="chip-list"><span class="muted">暂无在线账号</span></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h3>最近远程操作</h3><button id="refreshStatusBtn" class="text-button">刷新</button></div>
        <div id="commandList" class="command-list"><div class="empty">暂无远程操作</div></div>
      </section>
    </section>

    <section id="page-messages" class="page">
      <div class="message-toolbar">
        <select id="conversationSelect"><option value="">全部会话</option></select>
        <button id="refreshMessagesBtn" class="secondary">刷新</button>
      </div>
      <div id="messageList" class="message-list"><div class="empty">暂无同步消息</div></div>
      <form id="replyForm" class="reply-box hidden">
        <div id="replyTarget" class="reply-target"></div>
        <textarea id="replyText" maxlength="2000" rows="2" placeholder="通过 Windows Bot 发送人工回复"></textarea>
        <button id="sendReplyBtn" class="primary" type="submit">发送</button>
      </form>
    </section>

    <section id="page-settings" class="page">
      <section class="panel settings-panel">
        <h3>远程控制</h3>
        <label class="switch-row">
          <span><strong>智能自动回复</strong><small>关闭后，Windows Bot 仍接收消息，但不再进入智能回复流程。</small></span>
          <input id="autoReplyEnabled" type="checkbox">
        </label>
        <label class="switch-row">
          <span><strong>同步消息到 Web</strong><small>关闭后停止上传新的聊天文本，已有消息按保留天数清理。</small></span>
          <input id="messageSyncEnabled" type="checkbox">
        </label>
        <label class="switch-row">
          <span><strong>允许手机人工回复</strong><small>允许从本页面向当前买家发送文本消息。</small></span>
          <input id="manualReplyEnabled" type="checkbox">
        </label>
        <label class="field-row"><span>同步间隔</span><select id="syncInterval"><option value="2">2 秒</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="30">30 秒</option></select></label>
        <label class="field-row"><span>消息保留</span><select id="retentionDays"><option value="1">1 天</option><option value="3">3 天</option><option value="7">7 天</option><option value="14">14 天</option><option value="30">30 天</option></select></label>
        <button id="saveSettingsBtn" class="primary wide" type="button">保存并下发到 Windows Bot</button>
        <div id="settingsHint" class="hint"></div>
      </section>
      <section class="panel">
        <h3>当前客户端信息</h3>
        <dl id="clientInfo" class="info-list"></dl>
      </section>
      <section class="panel notice">
        <h3>安全说明</h3>
        <p>该页面必须通过 HTTPS 使用。客户端令牌等同于该 Bot 的登录凭据，丢失后应立即在服务端控制台停用或重新生成。</p>
      </section>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-page="status" class="active"><span>●</span>状态</button>
    <button data-page="messages"><span>▤</span>消息</button>
    <button data-page="settings"><span>⚙</span>设置</button>
  </nav>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/static/bot-web.js"></script>
</body>
</html>
